<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="262" viewBox="0 0 860 262" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">El cambio de contexto cuesta tiempo</title>
  <desc id="d">Dos líneas de tiempo de la CPU. Con turnos normales hay 4 cambios de contexto y se pierde un 10 % del tiempo. Con turnos diminutos hay 13 cambios y se pierde un tercio del tiempo.</desc>
  <defs>
    <pattern id="rayas" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#dcdfe4"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a8f98" stroke-width="2.5"/>
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="261" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">El cambio de contexto cuesta tiempo</text>

  <!-- Leyenda -->
  <g font-size="13" fill="#0b0b0b">
    <rect x="24" y="56" width="14" height="14" rx="3" fill="#2a78d6"/><text x="44" y="68">P1</text>
    <rect x="76" y="56" width="14" height="14" rx="3" fill="#eb6834"/><text x="96" y="68">P2</text>
    <rect x="128" y="56" width="14" height="14" rx="3" fill="#1baf7a"/><text x="148" y="68">P3</text>
    <rect x="180" y="56" width="14" height="14" rx="3" fill="url(#rayas)"/><text x="200" y="68">cambio de contexto: guardar el estado de uno y cargar el del siguiente (la CPU no avanza)</text>
  </g>

  <!-- Fila 1: turnos normales -->
  <text x="24" y="112" font-size="14" font-weight="700" fill="#0b0b0b">Turnos normales</text>
  <g>
    <rect x="200" y="94" width="138" height="30" fill="#2a78d6"/>
    <rect x="340" y="94" width="14" height="30" fill="url(#rayas)"/>
    <rect x="356" y="94" width="138" height="30" fill="#eb6834"/>
    <rect x="496" y="94" width="14" height="30" fill="url(#rayas)"/>
    <rect x="512" y="94" width="138" height="30" fill="#1baf7a"/>
    <rect x="652" y="94" width="14" height="30" fill="url(#rayas)"/>
    <rect x="668" y="94" width="138" height="30" fill="#2a78d6"/>
    <rect x="808" y="94" width="14" height="30" fill="url(#rayas)"/>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="269" y="114" fill="#ffffff">P1</text>
    <text x="425" y="114" fill="#0b0b0b">P2</text>
    <text x="581" y="114" fill="#0b0b0b">P3</text>
    <text x="737" y="114" fill="#ffffff">P1</text>
  </g>
  <text x="200" y="146" font-size="13" fill="#52514e">4 cambios → se pierde más o menos un 10 % del tiempo</text>

  <!-- Fila 2: turnos diminutos -->
  <text x="24" y="198" font-size="14" font-weight="700" fill="#0b0b0b">Turnos diminutos</text>
  <g>
    <rect x="200" y="180" width="28" height="30" fill="#2a78d6"/><rect x="230" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="246" y="180" width="28" height="30" fill="#eb6834"/><rect x="276" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="292" y="180" width="28" height="30" fill="#1baf7a"/><rect x="322" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="338" y="180" width="28" height="30" fill="#2a78d6"/><rect x="368" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="384" y="180" width="28" height="30" fill="#eb6834"/><rect x="414" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="430" y="180" width="28" height="30" fill="#1baf7a"/><rect x="460" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="476" y="180" width="28" height="30" fill="#2a78d6"/><rect x="506" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="522" y="180" width="28" height="30" fill="#eb6834"/><rect x="552" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="568" y="180" width="28" height="30" fill="#1baf7a"/><rect x="598" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="614" y="180" width="28" height="30" fill="#2a78d6"/><rect x="644" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="660" y="180" width="28" height="30" fill="#eb6834"/><rect x="690" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="706" y="180" width="28" height="30" fill="#1baf7a"/><rect x="736" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="752" y="180" width="28" height="30" fill="#2a78d6"/><rect x="782" y="180" width="14" height="30" fill="url(#rayas)"/>
    <rect x="798" y="180" width="28" height="30" fill="#eb6834"/>
  </g>
  <text x="200" y="232" font-size="13" fill="#52514e">13 cambios → se pierde casi un tercio del tiempo en «apuntar dónde iba»</text>
</svg>
