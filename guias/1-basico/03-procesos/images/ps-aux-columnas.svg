<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="236" viewBox="0 0 900 236" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cómo leer una línea de ps aux</title>
  <desc id="d">Cabecera y una línea de ps aux con las columnas explicadas: USER es quién lo lanzó, PID su número, %CPU y %MEM lo que consume, VSZ y RSS la memoria virtual y la real, STAT el estado, START y TIME la hora de inicio y el tiempo de CPU, y COMMAND la orden.</desc>
  <rect x="0.5" y="0.5" width="899" height="235" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="36" font-size="21" font-weight="700" fill="#0b0b0b">Cómo leer una línea de «ps aux»</text>

  <rect x="20" y="52" width="860" height="78" rx="10" fill="#1e2227"/>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16">
    <g fill="#9aa0a6">
      <text x="36" y="80">USER</text><text x="128" y="80">PID</text><text x="186" y="80">%CPU</text><text x="248" y="80">%MEM</text>
      <text x="318" y="80">VSZ</text><text x="384" y="80">RSS</text><text x="452" y="80">TTY</text><text x="526" y="80">STAT</text>
      <text x="586" y="80">START</text><text x="660" y="80">TIME</text><text x="730" y="80">COMMAND</text>
    </g>
    <g fill="#e6e9ee">
      <text x="36" y="112">alumno</text><text x="128" y="112">2150</text><text x="186" y="112">2.4</text><text x="248" y="112">0.2</text>
      <text x="318" y="112">8868</text><text x="384" y="112">4992</text><text x="452" y="112">pts/0</text><text x="526" y="112">R+</text>
      <text x="586" y="112">10:24</text><text x="660" y="112">0:02</text><text x="730" y="112">htop</text>
    </g>
  </g>

  <!-- marcas de color bajo cada columna -->
  <rect x="36" y="138" width="66" height="5" rx="2" fill="#2a78d6"/>
  <rect x="128" y="138" width="40" height="5" rx="2" fill="#eb6834"/>
  <rect x="186" y="138" width="102" height="5" rx="2" fill="#1baf7a"/>
  <rect x="318" y="138" width="106" height="5" rx="2" fill="#eda100"/>
  <rect x="526" y="138" width="40" height="5" rx="2" fill="#e87ba4"/>
  <rect x="586" y="138" width="114" height="5" rx="2" fill="#008300"/>
  <rect x="730" y="138" width="70" height="5" rx="2" fill="#6250d6"/>

  <g stroke="#9aa0a6" stroke-width="1">
    <line x1="69" y1="143" x2="69" y2="158"/>
    <line x1="148" y1="143" x2="148" y2="194"/>
    <line x1="237" y1="143" x2="237" y2="158"/>
    <line x1="371" y1="143" x2="371" y2="194"/>
    <line x1="546" y1="143" x2="546" y2="158"/>
    <line x1="643" y1="143" x2="643" y2="194"/>
    <line x1="765" y1="143" x2="765" y2="158"/>
  </g>
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <text x="69" y="174">quién lo lanzó</text>
    <text x="237" y="174">% de CPU y de RAM</text>
    <text x="546" y="174">estado (R, S, Z…)</text>
    <text x="765" y="174">la orden</text>
    <text x="148" y="210">su número (PID)</text>
    <text x="371" y="210">memoria virtual / real (KB)</text>
    <text x="643" y="210">hora de inicio / tiempo de CPU</text>
  </g>
</svg>
