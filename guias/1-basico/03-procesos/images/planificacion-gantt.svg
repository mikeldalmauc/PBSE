<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="392" viewBox="0 0 860 392" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Diagramas de Gantt: FCFS, SJF y Round Robin</title>
  <desc id="d">Cuatro procesos que llegan en el instante 0 con ráfagas P1 8, P2 4, P3 9 y P4 5. FCFS ejecuta P1 de 0 a 8, P2 de 8 a 12, P3 de 12 a 21 y P4 de 21 a 26, con espera media 10,25. SJF ejecuta P2 de 0 a 4, P4 de 4 a 9, P1 de 9 a 17 y P3 de 17 a 26, con espera media 7,5. Round Robin con cuanto 4 queda en blanco para el ejercicio.</desc>
  <rect x="0.5" y="0.5" width="859" height="391" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Tres formas de repartir la CPU</text>

  <!-- Leyenda -->
  <g font-size="13" fill="#0b0b0b">
    <rect x="24" y="56" width="14" height="14" rx="3" fill="#2a78d6"/><text x="44" y="68">P1 · necesita 8</text>
    <rect x="150" y="56" width="14" height="14" rx="3" fill="#eb6834"/><text x="170" y="68">P2 · necesita 4</text>
    <rect x="276" y="56" width="14" height="14" rx="3" fill="#1baf7a"/><text x="296" y="68">P3 · necesita 9</text>
    <rect x="402" y="56" width="14" height="14" rx="3" fill="#eda100"/><text x="422" y="68">P4 · necesita 5</text>
    <text x="540" y="68" fill="#52514e">(todos llegan en el instante 0)</text>
  </g>

  <!-- escala: x = 160 + t*25 -->
  <!-- FCFS -->
  <text x="24" y="112" font-size="16" font-weight="700" fill="#0b0b0b">FCFS</text>
  <text x="24" y="130" font-size="12" fill="#52514e">por orden de llegada</text>
  <text x="24" y="148" font-size="12" font-weight="700" fill="#0b0b0b">espera media 10,25</text>
  <rect x="160" y="100" width="198" height="34" fill="#2a78d6"/>
  <rect x="360" y="100" width="98" height="34" fill="#eb6834"/>
  <rect x="460" y="100" width="223" height="34" fill="#1baf7a"/>
  <rect x="685" y="100" width="125" height="34" fill="#eda100"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="259" y="122" fill="#ffffff">P1</text>
    <text x="409" y="122" fill="#0b0b0b">P2</text>
    <text x="571" y="122" fill="#0b0b0b">P3</text>
    <text x="747" y="122" fill="#0b0b0b">P4</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="160" y="152">0</text><text x="360" y="152">8</text><text x="460" y="152">12</text><text x="685" y="152">21</text><text x="810" y="152">26</text>
  </g>

  <!-- SJF -->
  <text x="24" y="212" font-size="16" font-weight="700" fill="#0b0b0b">SJF</text>
  <text x="24" y="230" font-size="12" fill="#52514e">primero el más corto</text>
  <text x="24" y="248" font-size="12" font-weight="700" fill="#0b0b0b">espera media 7,5</text>
  <rect x="160" y="200" width="98" height="34" fill="#eb6834"/>
  <rect x="260" y="200" width="123" height="34" fill="#eda100"/>
  <rect x="385" y="200" width="198" height="34" fill="#2a78d6"/>
  <rect x="585" y="200" width="225" height="34" fill="#1baf7a"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="209" y="222" fill="#0b0b0b">P2</text>
    <text x="322" y="222" fill="#0b0b0b">P4</text>
    <text x="484" y="222" fill="#ffffff">P1</text>
    <text x="697" y="222" fill="#0b0b0b">P3</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="160" y="252">0</text><text x="260" y="252">4</text><text x="385" y="252">9</text><text x="585" y="252">17</text><text x="810" y="252">26</text>
  </g>

  <!-- Round Robin -->
  <text x="24" y="312" font-size="16" font-weight="700" fill="#0b0b0b">Round Robin</text>
  <text x="24" y="330" font-size="12" fill="#52514e">turnos de 4 (cuanto = 4)</text>
  <text x="24" y="348" font-size="12" font-weight="700" fill="#0b0b0b">espera media ¿?</text>
  <rect x="160" y="300" width="650" height="34" fill="#ffffff" stroke="#c9ccd1"/>
  <g stroke="#e2e5e9" stroke-width="1">
    <line x1="185" y1="300" x2="185" y2="334"/><line x1="210" y1="300" x2="210" y2="334"/><line x1="235" y1="300" x2="235" y2="334"/><line x1="260" y1="300" x2="260" y2="334"/>
    <line x1="285" y1="300" x2="285" y2="334"/><line x1="310" y1="300" x2="310" y2="334"/><line x1="335" y1="300" x2="335" y2="334"/><line x1="360" y1="300" x2="360" y2="334"/>
    <line x1="385" y1="300" x2="385" y2="334"/><line x1="410" y1="300" x2="410" y2="334"/><line x1="435" y1="300" x2="435" y2="334"/><line x1="460" y1="300" x2="460" y2="334"/>
    <line x1="485" y1="300" x2="485" y2="334"/><line x1="510" y1="300" x2="510" y2="334"/><line x1="535" y1="300" x2="535" y2="334"/><line x1="560" y1="300" x2="560" y2="334"/>
    <line x1="585" y1="300" x2="585" y2="334"/><line x1="610" y1="300" x2="610" y2="334"/><line x1="635" y1="300" x2="635" y2="334"/><line x1="660" y1="300" x2="660" y2="334"/>
    <line x1="685" y1="300" x2="685" y2="334"/><line x1="710" y1="300" x2="710" y2="334"/><line x1="735" y1="300" x2="735" y2="334"/><line x1="760" y1="300" x2="760" y2="334"/>
    <line x1="785" y1="300" x2="785" y2="334"/>
  </g>
  <rect x="160" y="300" width="650" height="34" fill="none" stroke="#c9ccd1"/>
  <text x="485" y="322" font-size="14" font-weight="700" text-anchor="middle" fill="#6250d6">¡Te toca a ti! Es el ejercicio 2</text>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="160" y="352">0</text><text x="260" y="352">4</text><text x="360" y="352">8</text><text x="460" y="352">12</text><text x="560" y="352">16</text><text x="660" y="352">20</text><text x="760" y="352">24</text><text x="810" y="352">26</text>
  </g>
  <text x="24" y="378" font-size="12" fill="#52514e">Espera de un proceso = instante en que termina − lo que necesitaba (porque todos llegan en 0).</text>
</svg>
