<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="318" viewBox="0 0 900 318" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Arranque: lo viejo y lo nuevo</title>
  <desc id="d">Dos preguntas. Primera: quién despierta al ordenador. Antes, la BIOS: pantalla de texto, sólo teclado y lenta. Ahora, la UEFI: gráfica, con ratón y arranca en segundos. Segunda: cómo se organiza el disco por dentro. Antes, MBR: como mucho 4 particiones y discos de hasta 2 TB. Ahora, GPT: hasta 128 particiones y discos enormes. En clase usamos siempre UEFI + GPT: en VirtualBox se marca Habilitar EFI.</desc>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="317" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Arranque: lo viejo y lo nuevo</text>
  <text x="24" y="60" font-size="14" fill="#52514e">Son dos preguntas distintas. En clase usamos siempre la respuesta moderna: UEFI + GPT.</text>

  <!-- Fila 1 -->
  <rect x="24" y="80" width="200" height="90" rx="12" fill="#eef0f3" stroke="#8a8f98"/>
  <text x="40" y="118" font-size="14.5" font-weight="700" fill="#0b0b0b">¿Quién despierta</text>
  <text x="40" y="138" font-size="14.5" font-weight="700" fill="#0b0b0b">al ordenador?</text>

  <rect x="244" y="80" width="276" height="90" rx="12" fill="#ffffff" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="260" y="102" font-size="11" font-weight="700" letter-spacing="1" fill="#8a8f98">ANTES</text>
  <text x="260" y="130" font-size="22" font-weight="700" fill="#52514e">BIOS</text>
  <text x="260" y="156" font-size="12.5" fill="#52514e">Pantalla de texto, sólo teclado, lenta</text>

  <line x1="526" y1="125" x2="568" y2="125" stroke="#2a78d6" stroke-width="3" marker-end="url(#f)"/>

  <rect x="576" y="80" width="300" height="90" rx="12" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="592" y="102" font-size="11" font-weight="700" letter-spacing="1" fill="#2a78d6">AHORA · LA QUE USAMOS</text>
  <text x="592" y="130" font-size="22" font-weight="700" fill="#0b0b0b">UEFI</text>
  <text x="592" y="156" font-size="12.5" fill="#0b0b0b">Gráfica, con ratón, arranca en segundos</text>

  <!-- Fila 2 -->
  <rect x="24" y="190" width="200" height="90" rx="12" fill="#eef0f3" stroke="#8a8f98"/>
  <text x="40" y="228" font-size="14.5" font-weight="700" fill="#0b0b0b">¿Cómo se organiza</text>
  <text x="40" y="248" font-size="14.5" font-weight="700" fill="#0b0b0b">el disco por dentro?</text>

  <rect x="244" y="190" width="276" height="90" rx="12" fill="#ffffff" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="260" y="212" font-size="11" font-weight="700" letter-spacing="1" fill="#8a8f98">ANTES</text>
  <text x="260" y="240" font-size="22" font-weight="700" fill="#52514e">MBR</text>
  <text x="260" y="266" font-size="12.5" fill="#52514e">Máx. 4 particiones · discos de hasta 2 TB</text>

  <line x1="526" y1="235" x2="568" y2="235" stroke="#2a78d6" stroke-width="3" marker-end="url(#f)"/>

  <rect x="576" y="190" width="300" height="90" rx="12" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="592" y="212" font-size="11" font-weight="700" letter-spacing="1" fill="#2a78d6">AHORA · LA QUE USAMOS</text>
  <text x="592" y="240" font-size="22" font-weight="700" fill="#0b0b0b">GPT</text>
  <text x="592" y="266" font-size="12.5" fill="#0b0b0b">Hasta 128 particiones · discos enormes</text>

  <text x="24" y="304" font-size="13.5" fill="#52514e">En VirtualBox: marca <tspan font-weight="700" fill="#0b0b0b">«Habilitar EFI»</tspan>. Así la MV arranca con UEFI y el disco usa GPT.</text>
</svg>
