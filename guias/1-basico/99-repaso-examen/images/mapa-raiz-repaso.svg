    <line x1="464" y1="116" x2="464" y2="460"/>
    <line x1="44" y1="150" x2="62" y2="150"/><line x1="44" y1="212" x2="62" y2="212"/><line x1="44" y1="274" x2="62" y2="274"/>
    <line x1="44" y1="336" x2="62" y2="336"/><line x1="44" y1="398" x2="62" y2="398"/><line x1="44" y1="460" x2="62" y2="460"/>
    <line x1="464" y1="150" x2="482" y2="150"/><line x1="464" y1="212" x2="482" y2="212"/><line x1="464" y1="274" x2="482" y2="274"/>
    <line x1="464" y1="336" x2="482" y2="336"/><line x1="464" y1="398" x2="482" y2="398"/><line x1="464" y1="460" x2="482" y2="460"/>
  </g>

