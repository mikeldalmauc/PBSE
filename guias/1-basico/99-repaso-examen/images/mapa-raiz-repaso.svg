  <g font-size="12.5" fill="#52514e">
    <text x="160" y="166">ls, cp, mkdir… (es un atajo a /usr/bin)</text>
    <text x="160" y="228">el núcleo de Linux: vmlinuz-…</text>
    <text x="160" y="290">tu disco: /dev/sda · sus trozos: sda1, sda2…</text>
    <text x="160" y="352">passwd · hostname · hosts · fstab</text>
    <text x="160" y="414">la tuya: /home/alumno (o sea, ~)</text>
    <text x="160" y="476">/media/alumno/MI-USB</text>
    <text x="580" y="166">/mnt/cdrom</text>
    <text x="580" y="228">cpuinfo · meminfo (no está en el disco)</text>
    <text x="580" y="290">¡ojo! no es la raíz /</text>
    <text x="580" y="352">se vacía al reiniciar</text>
    <text x="580" y="414">/usr/bin · ojo: no significa «user»</text>
    <text x="580" y="476">los registros (logs): /var/log</text>
  </g>

  <!-- leyenda -->
