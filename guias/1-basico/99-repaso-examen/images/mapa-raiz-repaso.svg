    <text x="160" y="209">Arranque</text>
    <text x="160" y="271">Dispositivos (el hardware)</text>
    <text x="160" y="333">Configuración del sistema</text>
    <text x="160" y="395">Casas de los usuarios</text>
    <text x="160" y="457">Pendrives y discos que pinchas</text>
    <text x="580" y="147">Discos que montas a mano</text>
    <text x="580" y="209">Info del sistema en directo</text>
    <text x="580" y="271">Casa del administrador (root)</text>
    <text x="580" y="333">Temporales</text>
    <text x="580" y="395">Programas instalados</text>
    <text x="580" y="457">Datos que cambian</text>
