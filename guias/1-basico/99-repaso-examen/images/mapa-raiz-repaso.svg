<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">El mapa de la raíz /</title>
  <desc id="d">De la raíz / cuelgan doce carpetas importantes, en el orden en que salen con ls /. /bin: programas básicos como ls, cp o mkdir; es un atajo a /usr/bin. /boot: arranque; aquí está el núcleo de Linux, vmlinuz. /dev: dispositivos; el disco es /dev/sda y sus trozos sda1, sda2... /etc: configuración del sistema; passwd, hostname, hosts, fstab. /home: casas de los usuarios; la tuya es /home/alumno, o sea, ~. /media: pendrives y discos que pinchas, por ejemplo /media/alumno/MI-USB. /mnt: discos que montas a mano, por ejemplo /mnt/cdrom. /proc: información del sistema en directo; cpuinfo y meminfo, no está en el disco. /root: casa del administrador; no es la raíz /. /tmp: temporales; se vacía al reiniciar. /usr: programas instalados; /usr/bin; no significa user. /var: datos que cambian; los registros están en /var/log. Los colores agrupan: programas, configuración, casas, datos que cambian, hardware y núcleo, arranque, pendrives y discos.</desc>
  <rect x="0.5" y="0.5" width="899" height="527" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">El mapa de la raíz /</text>
  <text x="24" y="60" font-size="14" fill="#52514e">Las 12 carpetas que tienes que conocer, en el mismo orden en que salen con ls /.</text>

  <rect x="24" y="76" width="852" height="40" rx="10" fill="#1e2227"/>
  <text x="44" y="105" font-size="26" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#ffffff">/</text>
  <text x="74" y="102" font-size="14" fill="#c9ccd1">la raíz: de aquí cuelga todo, también los pendrives  ·  ¡no la confundas con /root!</text>

