<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cómo ver un fichero según lo largo que sea</title>
  <desc id="d">El fichero /etc/passwd dibujado como una tira de líneas. head -n 3 enseña las tres primeras líneas. tail -n 3 enseña las tres últimas. less enseña una pantalla cada vez y te deja bajar con Espacio, subir con b, buscar con /texto y salir con q. cat lo enseña todo de golpe, y si es largo el principio se escapa por arriba. wc -l no lo enseña: cuenta las líneas.</desc>
  <rect x="0.5" y="0.5" width="899" height="399" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">¿Cómo veo un fichero? Según lo largo que sea</text>
  <text x="24" y="62" font-size="14" fill="#52514e"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">/etc/passwd</tspan> tiene una línea por cada usuario del sistema: varias decenas. No cabe en una pantalla.</text>

  <!-- el fichero -->
  <rect x="370" y="74" width="170" height="304" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="380" y="90" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#52514e">/etc/passwd</text>
  <line x1="370" y1="98" x2="540" y2="98" stroke="#e2e5e9"/>
  <rect x="375" y="174" width="160" height="98" rx="5" fill="#d3f2e6" stroke="#1baf7a" stroke-width="2"/>
  <rect x="382" y="106" width="120" height="5" rx="2" fill="#2a78d6"/>
  <rect x="382" y="118" width="140" height="5" rx="2" fill="#2a78d6"/>
  <rect x="382" y="130" width="128" height="5" rx="2" fill="#2a78d6"/>
  <rect x="382" y="142" width="110" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="154" width="136" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="166" width="96" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="178" width="124" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="190" width="140" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="202" width="104" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="214" width="132" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="226" width="116" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="238" width="138" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="250" width="100" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="262" width="126" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="274" width="140" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="286" width="112" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="298" width="130" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="310" width="98" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="322" width="134" height="5" rx="2" fill="#8a8f98" fill-opacity="0.45"/>
  <rect x="382" y="334" width="120" height="5" rx="2" fill="#eb6834"/>
  <rect x="382" y="346" width="108" height="5" rx="2" fill="#eb6834"/>
  <rect x="382" y="358" width="128" height="5" rx="2" fill="#eb6834"/>

  <!-- izquierda: head, less, tail -->
  <g stroke-width="2">
    <line x1="356" y1="113" x2="378" y2="113" stroke="#2a78d6"/>
    <line x1="356" y1="226" x2="372" y2="226" stroke="#1baf7a"/>
    <line x1="356" y1="343" x2="378" y2="343" stroke="#eb6834"/>
  </g>
  <g text-anchor="end">
    <text x="350" y="112" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#0b0b0b">head -n 3 /etc/passwd</text>
    <text x="350" y="130" font-size="12.5" fill="#52514e">las primeras líneas (10 si no pones -n)</text>
    <text x="350" y="222" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#0b0b0b">less /etc/passwd</text>
    <text x="350" y="240" font-size="12.5" fill="#52514e">una pantalla cada vez: Espacio baja,</text>
    <text x="350" y="256" font-size="12.5" fill="#52514e">b sube, /texto busca y q sale</text>
    <text x="350" y="342" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#0b0b0b">tail -n 3 /etc/passwd</text>
    <text x="350" y="360" font-size="12.5" fill="#52514e">las últimas líneas (10 si no pones -n)</text>
  </g>

  <!-- derecha: cat y wc, que trabajan con el fichero entero -->
  <path d="M550 104 H 560 V 370 H 550" fill="none" stroke="#8a8f98" stroke-width="2"/>
  <g stroke="#8a8f98" stroke-width="2">
    <line x1="560" y1="110" x2="578" y2="110"/>
    <line x1="560" y1="340" x2="578" y2="340"/>
  </g>
  <text x="586" y="114" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#0b0b0b">cat /etc/passwd</text>
  <text x="586" y="132" font-size="12.5" fill="#52514e">todo de golpe. Si es largo, el principio</text>
  <text x="586" y="148" font-size="12.5" fill="#52514e">se te escapa por arriba de la pantalla.</text>
  <text x="586" y="344" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#0b0b0b">wc -l /etc/passwd</text>
  <text x="586" y="362" font-size="12.5" fill="#52514e">no lo enseña: cuenta las líneas</text>
  <text x="586" y="378" font-size="12.5" fill="#52514e">y escribe el número y el nombre.</text>
</svg>
