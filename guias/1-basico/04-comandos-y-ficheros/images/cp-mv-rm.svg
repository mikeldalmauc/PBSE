  <g font-size="12.5" fill="#52514e">
    <text x="40" y="292">El original se queda donde estaba.</text>
    <text x="40" y="310">Ahora hay dos ficheros iguales.</text>
    <text x="332" y="292">Se va de aquí y aparece en docs/.</text>
    <text x="332" y="310">Con un nombre nuevo, lo renombra.</text>
    <text x="624" y="292">Desaparece para siempre:</text>
    <text x="624" y="310">sin papelera y sin deshacer.</text>
