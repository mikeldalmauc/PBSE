<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="428" viewBox="0 0 900 428" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Copiar, mover y borrar: qué queda después</title>
  <desc id="d">Tres casos con el fichero informe.txt en la carpeta actual y una carpeta docs. Con cp informe.txt docs/ el original se queda y aparece una copia en docs: hay dos. Con mv informe.txt docs/ el fichero se va de la carpeta actual y aparece en docs; con un nombre nuevo en lugar de una carpeta, lo renombra. Con rm informe.txt el fichero desaparece para siempre, sin papelera. Abajo: si el destino es una carpeta que ya existe, lo que copias o mueves entra dentro. cp -r fotos copia crea copia si no existe, pero si ya existe deja la copia en copia/fotos.</desc>
