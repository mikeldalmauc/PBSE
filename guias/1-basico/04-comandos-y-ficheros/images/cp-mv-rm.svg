  <line x1="24" y1="344" x2="876" y2="344" stroke="#e2e5e9"/>
  <text x="24" y="368" font-size="14" font-weight="700" fill="#0b0b0b">Ojo con el destino: si es una carpeta que ya existe, lo que copias o mueves entra dentro.</text>
  <text x="24" y="392" font-size="13" fill="#52514e"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">cp -r fotos copia</tspan>  →  si <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">copia</tspan> no existe, la crea: <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">copia</tspan> es un duplicado de <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">fotos</tspan>.</text>
  <text x="24" y="414" font-size="13" fill="#52514e"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">cp -r fotos copia</tspan>  →  si <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">copia</tspan> ya existe, la copia queda dentro: <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">copia/fotos</tspan>. Con <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">mv</tspan> pasa igual.</text>
</svg>
