<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Tres formas de llegar al mismo fichero</title>
  <desc id="d">Árbol con / , home, alumno, y dentro de alumno las carpetas docs y proyectos. En docs está informe.txt y en proyectos la carpeta web, donde estás. Ruta absoluta: empieza en la raíz, cat /home/alumno/docs/informe.txt. Ruta relativa: sube dos niveles con .. y baja, cat ../../docs/informe.txt. Con el atajo ~: empieza en tu carpeta personal, cat ~/docs/informe.txt. Leyenda: punto es esta carpeta, dos puntos la de arriba, ~ tu carpeta personal y / la raíz.</desc>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/>
    </marker>
    <marker id="fn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/>
    </marker>
    <marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="439" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Tres formas de llegar al mismo fichero</text>
  <text x="24" y="62" font-size="14" fill="#52514e">Estás en <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">/home/alumno/proyectos/web</tspan> y quieres leer <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">/home/alumno/docs/informe.txt</tspan></text>

  <!-- aristas -->
  <g fill="none" stroke-width="4" stroke-linejoin="round">
    <path d="M230 114 V 136" stroke="#2a78d6" marker-end="url(#fa)"/>
    <path d="M230 170 V 192" stroke="#2a78d6" marker-end="url(#fa)"/>
    <path d="M200 226 V 244 H 120 V 260" stroke="#52514e" marker-end="url(#fg)"/>
    <path d="M120 294 V 328" stroke="#52514e" marker-end="url(#fg)"/>
    <path d="M340 330 V 296" stroke="#eb6834" marker-end="url(#fn)"/>
    <path d="M340 262 V 244 H 260 V 228" stroke="#eb6834" marker-end="url(#fn)"/>
  </g>

  <!-- nodos -->
  <rect x="206" y="82" width="48" height="32" rx="8" fill="#1e2227"/>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">
    <text x="230" y="104" font-size="18" fill="#e6e9ee">/</text>
    <rect x="182" y="138" width="96" height="32" rx="8" fill="#eef0f3" stroke="#8a8f98" stroke-width="2"/>
    <text x="230" y="159">home</text>
    <rect x="175" y="194" width="110" height="32" rx="8" fill="#d3f2e6" stroke="#1baf7a" stroke-width="2"/>
    <text x="230" y="215">alumno</text>
    <rect x="72" y="262" width="96" height="32" rx="8" fill="#eef0f3" stroke="#8a8f98" stroke-width="2"/>
    <text x="120" y="283">docs</text>
    <rect x="278" y="262" width="124" height="32" rx="8" fill="#eef0f3" stroke="#8a8f98" stroke-width="2"/>
    <text x="340" y="283">proyectos</text>
    <rect x="52" y="330" width="136" height="32" rx="8" fill="#fdefcc" stroke="#eda100" stroke-width="2"/>
    <text x="120" y="351">informe.txt</text>
    <rect x="292" y="330" width="96" height="32" rx="8" fill="#fde4d8" stroke="#eb6834" stroke-width="2"/>
    <text x="340" y="351">web</text>
  </g>

  <!-- etiquetas del árbol -->
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#0b0b0b">
    <text x="350" y="318">..</text>
    <text x="350" y="258">..</text>
  </g>
  <g font-size="12.5" fill="#52514e">
    <text x="264" y="103">la absoluta empieza aquí</text>
    <text x="294" y="208"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">~</tspan> empieza aquí</text>
  </g>
  <g font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">
    <text x="340" y="382">estás aquí</text>
    <text x="120" y="382">quieres leer esto</text>
  </g>

  <!-- las tres órdenes -->
  <rect x="470" y="82" width="406" height="90" rx="10" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="486" y="104" font-size="14" font-weight="700" fill="#0b0b0b">Absoluta · empieza por /</text>
  <text x="486" y="130" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#0b0b0b">cat /home/alumno/docs/informe.txt</text>
  <text x="486" y="156" font-size="12.5" fill="#52514e">Vale estés donde estés. Es larga, pero no falla.</text>

  <rect x="470" y="184" width="406" height="104" rx="10" fill="#fde4d8" stroke="#eb6834" stroke-width="2"/>
  <text x="486" y="206" font-size="14" font-weight="700" fill="#0b0b0b">Relativa · desde donde estás</text>
  <text x="486" y="232" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#0b0b0b">cat ../../docs/informe.txt</text>
  <text x="486" y="256" font-size="12.5" fill="#52514e">Cada <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">..</tspan> sube un nivel: web → proyectos → alumno.</text>
  <text x="486" y="274" font-size="12.5" fill="#52514e">Después baja: docs → informe.txt.</text>

  <rect x="470" y="300" width="406" height="90" rx="10" fill="#d3f2e6" stroke="#1baf7a" stroke-width="2"/>
  <text x="486" y="322" font-size="14" font-weight="700" fill="#0b0b0b">Con ~ · desde tu carpeta personal</text>
  <text x="486" y="348" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#0b0b0b">cat ~/docs/informe.txt</text>
  <text x="486" y="374" font-size="12.5" fill="#52514e">bash cambia <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">~</tspan> por /home/alumno antes de ejecutar la orden.</text>

  <text x="24" y="420" font-size="13" fill="#52514e"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">.</tspan> esta carpeta · <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">..</tspan> la de arriba · <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">~</tspan> tu carpeta personal · <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">/</tspan> la raíz (y el separador entre carpetas). Las tres órdenes hacen exactamente lo mismo.</text>
</svg>
