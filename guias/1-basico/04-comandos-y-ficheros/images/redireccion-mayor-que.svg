<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Un mayor que machaca, dos añaden</title>
  <desc id="d">El fichero nota.txt tiene dos líneas, Hola y ¿Qué tal?. Con echo "Adiós" &gt; nota.txt el fichero se queda sólo con Adiós: lo de antes se pierde. Con echo "Adiós" &gt;&gt; nota.txt el fichero queda con Hola, ¿Qué tal? y Adiós al final. Si el fichero no existía, los dos lo crean.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="319" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Un &gt; machaca, dos &gt;&gt; añaden</text>

  <!-- panel izquierdo: > -->
  <rect x="24" y="56" width="408" height="226" rx="12" fill="#ffffff" stroke="#e2e5e9"/>
  <rect x="40" y="68" width="40" height="30" rx="7" fill="#fde4d8" stroke="#eb6834" stroke-width="2"/>
  <text x="60" y="89" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" text-anchor="middle" fill="#0b0b0b">&gt;</text>
  <text x="92" y="89" font-size="15" font-weight="700" fill="#0b0b0b">machaca: lo de antes se pierde</text>
  <rect x="40" y="110" width="376" height="32" rx="6" fill="#1e2227"/>
  <text x="52" y="131" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e6e9ee">echo "Adiós" &gt; nota.txt</text>

  <rect x="48" y="158" width="140" height="92" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <rect x="268" y="158" width="140" height="92" rx="6" fill="#fde4d8" stroke="#eb6834" stroke-width="2"/>
  <g stroke="#e2e5e9"><line x1="48" y1="182" x2="188" y2="182"/><line x1="268" y1="182" x2="408" y2="182" stroke="#eb6834"/></g>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace">
    <text x="58" y="175" font-size="12" fill="#52514e">nota.txt</text>
    <text x="58" y="202" font-size="14" fill="#0b0b0b">Hola</text>
    <text x="58" y="221" font-size="14" fill="#0b0b0b">¿Qué tal?</text>
    <text x="278" y="175" font-size="12" fill="#52514e">nota.txt</text>
    <text x="278" y="202" font-size="14" font-weight="700" fill="#0b0b0b">Adiós</text>
  </g>
  <path d="M196 204 H 258" stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="118" y="268">antes</text>
    <text x="338" y="268">después: sólo queda lo nuevo</text>
  </g>

  <!-- panel derecho: >> -->
  <rect x="448" y="56" width="408" height="226" rx="12" fill="#ffffff" stroke="#e2e5e9"/>
  <rect x="464" y="68" width="52" height="30" rx="7" fill="#d3f2e6" stroke="#1baf7a" stroke-width="2"/>
  <text x="490" y="89" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" text-anchor="middle" fill="#0b0b0b">&gt;&gt;</text>
  <text x="528" y="89" font-size="15" font-weight="700" fill="#0b0b0b">añade al final: lo de antes se queda</text>
  <rect x="464" y="110" width="376" height="32" rx="6" fill="#1e2227"/>
  <text x="476" y="131" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e6e9ee">echo "Adiós" &gt;&gt; nota.txt</text>

  <rect x="472" y="158" width="140" height="92" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <rect x="692" y="158" width="140" height="92" rx="6" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
  <rect x="696" y="227" width="132" height="20" rx="4" fill="#d3f2e6"/>
  <g stroke="#e2e5e9"><line x1="472" y1="182" x2="612" y2="182"/><line x1="692" y1="182" x2="832" y2="182" stroke="#1baf7a"/></g>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace">
    <text x="482" y="175" font-size="12" fill="#52514e">nota.txt</text>
    <text x="482" y="202" font-size="14" fill="#0b0b0b">Hola</text>
    <text x="482" y="221" font-size="14" fill="#0b0b0b">¿Qué tal?</text>
    <text x="702" y="175" font-size="12" fill="#52514e">nota.txt</text>
    <text x="702" y="202" font-size="14" fill="#0b0b0b">Hola</text>
    <text x="702" y="221" font-size="14" fill="#0b0b0b">¿Qué tal?</text>
    <text x="702" y="242" font-size="14" font-weight="700" fill="#0b0b0b">Adiós</text>
  </g>
  <path d="M620 204 H 682" stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="542" y="268">antes</text>
    <text x="762" y="268">después: lo nuevo, al final</text>
  </g>

  <text x="24" y="306" font-size="13" fill="#52514e">Si <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">nota.txt</tspan> no existía, los dos lo crean. La diferencia sólo se nota cuando ya tiene algo dentro, y <tspan font-weight="700" fill="#0b0b0b">no pregunta</tspan>.</text>
</svg>
