<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">UAC en Windows y sudo en Linux</title>
  <desc id="d">A la izquierda, la ventana del Control de cuentas de usuario de Windows preguntando si permites que una aplicación haga cambios, con los botones Sí y No. A la derecha, un terminal de Linux donde sudo pide la contraseña del usuario. En los dos sistemas trabajas como usuario normal y pides permisos de administrador sólo para una tarea.</desc>
  <rect x="0.5" y="0.5" width="859" height="329" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Pedir permiso de administrador: UAC y sudo</text>

  <!-- UAC -->
  <text x="24" y="70" font-size="14" font-weight="700" fill="#0b0b0b">Windows · Control de cuentas de usuario</text>
  <rect x="24" y="80" width="390" height="180" rx="8" fill="#ffffff" stroke="#8a8f98"/>
  <rect x="24" y="80" width="390" height="34" rx="8" fill="#1d3aa6"/><rect x="24" y="100" width="390" height="14" fill="#1d3aa6"/>
  <text x="40" y="102" font-size="12.5" fill="#ffffff">Control de cuentas de usuario</text>
  <text x="40" y="138" font-size="14" font-weight="700" fill="#0b0b0b">¿Quieres permitir que esta aplicación</text>
  <text x="40" y="156" font-size="14" font-weight="700" fill="#0b0b0b">haga cambios en el dispositivo?</text>
  <text x="40" y="182" font-size="12.5" fill="#0b0b0b">Editor del Registro</text>
  <text x="40" y="200" font-size="12" fill="#52514e">Editor comprobado: Microsoft Windows</text>
  <rect x="134" y="218" width="130" height="30" rx="5" fill="#2a78d6"/><text x="199" y="238" font-size="13" text-anchor="middle" fill="#ffffff">Sí</text>
  <rect x="272" y="218" width="130" height="30" rx="5" fill="#eef0f3" stroke="#c9ccd1"/><text x="337" y="238" font-size="13" text-anchor="middle" fill="#0b0b0b">No</text>

  <!-- sudo -->
  <text x="446" y="70" font-size="14" font-weight="700" fill="#0b0b0b">Linux · sudo</text>
  <rect x="446" y="80" width="390" height="180" rx="8" fill="#1e2227"/>
  <g font-size="13" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#e6e9ee">
    <text x="462" y="112"><tspan fill="#7fe0b6">alumno@mint-smr</tspan>:~$ sudo apt update</text>
    <text x="462" y="136">[sudo] contraseña para alumno: ▌</text>
  </g>
  <text x="462" y="190" font-size="12" fill="#c9ccd1">Pide TU contraseña, y sólo funciona si estás</text>
  <text x="462" y="208" font-size="12" fill="#c9ccd1">en el grupo de administradores (sudo o wheel).</text>

  <g font-size="13" fill="#0b0b0b">
    <text x="24" y="290"><tspan font-weight="700">La idea es la misma:</tspan> trabajas como usuario normal y pides permisos de administrador sólo para una tarea.</text>
    <text x="24" y="312" fill="#52514e">Si eres administrador, UAC sólo te pide «Sí»; si eres usuario estándar, te pide la contraseña de un administrador.</text>
  </g>
</svg>
