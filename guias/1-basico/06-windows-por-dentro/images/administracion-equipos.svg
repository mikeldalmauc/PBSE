<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Administración de equipos y sus equivalentes en Linux</title>
  <desc id="d">Árbol de Administración de equipos: Herramientas del sistema con Programador de tareas, equivalente a cron; Visor de eventos, equivalente a journalctl; Carpetas compartidas; Usuarios y grupos locales, equivalente a useradd y /etc/passwd; Rendimiento, equivalente a btop; Administrador de dispositivos, equivalente a lspci y lsusb. Almacenamiento con Administración de discos, equivalente a lsblk y fdisk. Servicios y Aplicaciones con Servicios, equivalente a systemctl.</desc>
  <rect x="0.5" y="0.5" width="899" height="419" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Administración de equipos: todo en una ventana</text>
  <text x="24" y="60" font-size="13" fill="#52514e">compmgmt.msc · y lo que usarías en Linux para lo mismo</text>

  <rect x="24" y="74" width="470" height="330" rx="8" fill="#ffffff" stroke="#8a8f98"/>
  <g font-size="13.5" fill="#0b0b0b">
    <text x="40" y="100" font-weight="700">Administración de equipos (local)</text>
    <text x="56" y="128" font-weight="700">▾ Herramientas del sistema</text>
    <text x="84" y="154">Programador de tareas</text>
    <text x="84" y="180">Visor de eventos</text>
    <text x="84" y="206">Carpetas compartidas</text>
    <text x="84" y="232">Usuarios y grupos locales</text>
    <text x="84" y="258">Rendimiento</text>
    <text x="84" y="284">Administrador de dispositivos</text>
    <text x="56" y="312" font-weight="700">▾ Almacenamiento</text>
    <text x="84" y="338">Administración de discos</text>
    <text x="56" y="366" font-weight="700">▾ Servicios y Aplicaciones</text>
    <text x="84" y="392">Servicios</text>
  </g>
  <g fill="#2a78d6">
    <rect x="66" y="144" width="10" height="10" rx="2"/><rect x="66" y="170" width="10" height="10" rx="2" fill="#eb6834"/>
    <rect x="66" y="196" width="10" height="10" rx="2" fill="#8a8f98"/><rect x="66" y="222" width="10" height="10" rx="2" fill="#1baf7a"/>
    <rect x="66" y="248" width="10" height="10" rx="2" fill="#eda100"/><rect x="66" y="274" width="10" height="10" rx="2" fill="#e87ba4"/>
    <rect x="66" y="328" width="10" height="10" rx="2" fill="#6250d6"/><rect x="66" y="382" width="10" height="10" rx="2" fill="#008300"/>
  </g>

  <g stroke="#c9ccd1" stroke-dasharray="3 4">
    <line x1="280" y1="150" x2="520" y2="150"/><line x1="230" y1="176" x2="520" y2="176"/>
    <line x1="250" y1="202" x2="520" y2="202"/><line x1="268" y1="228" x2="520" y2="228"/>
    <line x1="180" y1="254" x2="520" y2="254"/><line x1="298" y1="280" x2="520" y2="280"/>
    <line x1="262" y1="334" x2="520" y2="334"/><line x1="152" y1="388" x2="520" y2="388"/>
  </g>
  <text x="530" y="100" font-size="12" font-weight="700" letter-spacing="1" fill="#52514e">EN LINUX</text>
  <g font-size="13.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">
    <text x="530" y="154">cron · systemd timers</text>
    <text x="530" y="180">journalctl · /var/log</text>
    <text x="530" y="206" font-family="'Segoe UI', Roboto, sans-serif" fill="#52514e">Samba (otro módulo)</text>
    <text x="530" y="232">useradd · /etc/passwd</text>
    <text x="530" y="258">top · btop</text>
    <text x="530" y="284">lspci · lsusb</text>
    <text x="530" y="338">lsblk · fdisk</text>
    <text x="530" y="392">systemctl</text>
  </g>
</svg>
