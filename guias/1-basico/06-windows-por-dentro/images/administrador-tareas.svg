<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">El Administrador de tareas de Windows 11</title>
  <desc id="d">Esquema del Administrador de tareas: a la izquierda las pestañas Procesos, Rendimiento, Historial de aplicaciones, Aplicaciones de arranque, Usuarios, Detalles y Servicios; arriba un buscador por nombre o PID y el botón Finalizar tarea; en el centro la lista de procesos con columnas de CPU, memoria, disco y red, coloreadas con más intensidad cuanto más consumen.</desc>
  <rect x="0.5" y="0.5" width="899" height="399" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">El Administrador de tareas (Ctrl + Mayús + Esc)</text>

  <rect x="24" y="56" width="620" height="326" rx="8" fill="#ffffff" stroke="#8a8f98"/>
  <path d="M24 64 a8 8 0 0 1 8 -8 h604 a8 8 0 0 1 8 8 v24 h-620 z" fill="#eef0f3"/>
  <text x="40" y="77" font-size="12.5" fill="#0b0b0b">Administrador de tareas</text>
  <rect x="236" y="62" width="230" height="20" rx="10" fill="#ffffff" stroke="#c9ccd1"/>
  <text x="248" y="76" font-size="11" fill="#8a8f98">Escribe un nombre, editor o PID…</text>

  <!-- menú lateral -->
  <rect x="24" y="88" width="170" height="294" fill="#f7f8fa"/>
  <g font-size="12.5" fill="#0b0b0b">
    <rect x="30" y="96" width="158" height="26" rx="5" fill="#cde2fb"/>
    <text x="42" y="114" font-weight="700">Procesos</text>
    <text x="42" y="144">Rendimiento</text>
    <text x="42" y="172">Historial de aplicaciones</text>
    <text x="42" y="200">Aplicaciones de arranque</text>
    <text x="42" y="228">Usuarios</text>
    <text x="42" y="256">Detalles</text>
    <text x="42" y="284">Servicios</text>
    <text x="42" y="366" fill="#52514e">Configuración</text>
  </g>

  <!-- barra de acciones -->
  <text x="208" y="112" font-size="15" font-weight="700" fill="#0b0b0b">Procesos</text>
  <rect x="514" y="98" width="116" height="22" rx="5" fill="#eef0f3" stroke="#c9ccd1"/>
  <text x="572" y="113" font-size="11.5" text-anchor="middle" fill="#0b0b0b">Finalizar tarea</text>

  <!-- tabla -->
  <g font-size="11.5" fill="#52514e">
    <text x="208" y="146">Nombre</text><text x="410" y="146">CPU</text><text x="460" y="146">Memoria</text><text x="532" y="146">Disco</text><text x="590" y="146">Red</text>
  </g>
  <g font-size="11.5" font-weight="700" fill="#0b0b0b">
    <text x="410" y="132">23 %</text><text x="460" y="132">61 %</text><text x="532" y="132">2 %</text><text x="590" y="132">0 %</text>
  </g>
  <line x1="200" y1="152" x2="640" y2="152" stroke="#e2e5e9"/>
  <text x="208" y="172" font-size="11.5" font-weight="700" fill="#0b0b0b">Aplicaciones (3)</text>
  <!-- celdas de calor -->
  <g>
    <rect x="404" y="180" width="50" height="22" fill="#fdefcc"/><rect x="456" y="180" width="70" height="22" fill="#fbd38d"/>
    <rect x="404" y="204" width="50" height="22" fill="#fff8e6"/><rect x="456" y="204" width="70" height="22" fill="#fdefcc"/>
    <rect x="404" y="228" width="50" height="22" fill="#fff8e6"/><rect x="456" y="228" width="70" height="22" fill="#fff8e6"/>
    <rect x="404" y="276" width="50" height="22" fill="#fbd38d"/><rect x="456" y="276" width="70" height="22" fill="#fdefcc"/>
    <rect x="404" y="300" width="50" height="22" fill="#fff8e6"/><rect x="456" y="300" width="70" height="22" fill="#fff8e6"/>
  </g>
  <g font-size="12" fill="#0b0b0b">
    <text x="214" y="196">Firefox</text><text x="410" y="196">6,1 %</text><text x="460" y="196">812 MB</text><text x="532" y="196">0,1 MB/s</text><text x="590" y="196">0 Mbps</text>
    <text x="214" y="220">Explorador de Windows</text><text x="410" y="220">0,4 %</text><text x="460" y="220">96 MB</text><text x="532" y="220">0 MB/s</text><text x="590" y="220">0 Mbps</text>
    <text x="214" y="244">Terminal</text><text x="410" y="244">0,2 %</text><text x="460" y="244">58 MB</text><text x="532" y="244">0 MB/s</text><text x="590" y="244">0 Mbps</text>
    <text x="208" y="268" font-weight="700">Procesos en segundo plano (94)</text>
    <text x="214" y="292">Antimalware Service Executable</text><text x="410" y="292">9,8 %</text><text x="460" y="292">210 MB</text><text x="532" y="292">1,2 MB/s</text><text x="590" y="292">0 Mbps</text>
    <text x="214" y="316">Cola de impresión</text><text x="410" y="316">0 %</text><text x="460" y="316">6 MB</text><text x="532" y="316">0 MB/s</text><text x="590" y="316">0 Mbps</text>
  </g>

  <!-- números -->
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="186" cy="100" r="10" fill="#2a78d6"/><text x="186" y="104">1</text>
    <circle cx="476" cy="72" r="10" fill="#eb6834"/><text x="476" y="76">2</text>
    <circle cx="632" cy="96" r="10" fill="#d03b3b"/><text x="632" y="100">3</text>
    <circle cx="430" cy="342" r="10" fill="#eda100"/><text x="430" y="346" fill="#0b0b0b">4</text>
  </g>

  <!-- leyenda -->
  <g font-size="13" fill="#0b0b0b">
    <circle cx="672" cy="80" r="10" fill="#2a78d6"/><text x="672" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="690" y="85" font-weight="700">Pestañas</text>
    <text x="690" y="103" fill="#52514e">Detalles = con PID</text>
    <text x="690" y="119" fill="#52514e">Aplic. de arranque = qué</text>
    <text x="690" y="135" fill="#52514e">se abre al encender</text>

    <circle cx="672" cy="166" r="10" fill="#eb6834"/><text x="672" y="170" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="690" y="171" font-weight="700">Buscador</text>
    <text x="690" y="189" fill="#52514e">por nombre o por PID</text>

    <circle cx="672" cy="220" r="10" fill="#d03b3b"/><text x="672" y="224" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="690" y="225" font-weight="700">Finalizar tarea</text>
    <text x="690" y="243" fill="#52514e">el «kill» de Windows</text>

    <circle cx="672" cy="274" r="10" fill="#eda100"/><text x="672" y="278" font-size="12" font-weight="700" text-anchor="middle" fill="#0b0b0b">4</text>
    <text x="690" y="279" font-weight="700">Mapa de calor</text>
    <text x="690" y="297" fill="#52514e">más color = más consumo.</text>
    <text x="690" y="313" fill="#52514e">Clic en una columna</text>
    <text x="690" y="329" fill="#52514e">para ordenar.</text>
  </g>
  <text x="664" y="372" font-size="11.5" fill="#52514e">Esquema simplificado de Windows 11.</text>
</svg>
