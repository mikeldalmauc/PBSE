<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Administración de discos</title>
  <desc id="d">Esquema de Administración de discos. Disco 0, de 60 GB y tabla GPT, con una partición de sistema EFI de 100 MB, la partición reservada de Microsoft de 16 MB que esta ventana no enseña, el volumen Windows C: en NTFS y una partición de recuperación. Disco 1, un pincho Ventoy con la partición Ventoy E: en exFAT y la partición VTOYEFI de 32 MB.</desc>
  <rect x="0.5" y="0.5" width="899" height="339" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Administración de discos (diskmgmt.msc)</text>

  <!-- Disco 0 -->
  <rect x="24" y="62" width="140" height="84" rx="4" fill="#eef0f3" stroke="#8a8f98"/>
  <g font-size="12.5" fill="#0b0b0b">
    <text x="34" y="82" font-weight="700">Disco 0</text><text x="34" y="100">Básico</text><text x="34" y="116">60,00 GB</text><text x="34" y="132">En línea</text>
  </g>
  <g>
    <rect x="166" y="62" width="104" height="84" fill="#ffffff" stroke="#8a8f98"/><rect x="166" y="62" width="104" height="8" fill="#1d3aa6"/>
    <rect x="272" y="62" width="60" height="84" fill="#ffffff" stroke="#8a8f98" stroke-dasharray="5 4"/>
    <rect x="334" y="62" width="420" height="84" fill="#ffffff" stroke="#8a8f98"/><rect x="334" y="62" width="420" height="8" fill="#1d3aa6"/>
    <rect x="756" y="62" width="120" height="84" fill="#ffffff" stroke="#8a8f98"/><rect x="756" y="62" width="120" height="8" fill="#1d3aa6"/>
  </g>
  <g font-size="12" fill="#0b0b0b">
    <text x="174" y="90" font-weight="700">100 MB</text><text x="174" y="106">Correcto (partición</text><text x="174" y="122">de sistema EFI)</text>
    <text x="280" y="90" font-weight="700" fill="#52514e">MSR</text><text x="280" y="106" fill="#52514e">16 MB</text><text x="280" y="122" fill="#52514e">(no sale)</text>
    <text x="344" y="90" font-weight="700">Windows (C:)</text><text x="344" y="106">59,15 GB NTFS</text><text x="344" y="122">Correcto (arranque, archivo de paginación…)</text>
    <text x="764" y="90" font-weight="700">750 MB</text><text x="764" y="106">Correcto (partición</text><text x="764" y="122">de recuperación)</text>
  </g>

  <!-- Disco 1 -->
  <rect x="24" y="160" width="140" height="84" rx="4" fill="#eef0f3" stroke="#8a8f98"/>
  <g font-size="12.5" fill="#0b0b0b">
    <text x="34" y="180" font-weight="700">Disco 1</text><text x="34" y="198">Extraíble</text><text x="34" y="214">57,70 GB</text><text x="34" y="230">En línea</text>
  </g>
  <g>
    <rect x="166" y="160" width="590" height="84" fill="#ffffff" stroke="#8a8f98"/><rect x="166" y="160" width="590" height="8" fill="#1d3aa6"/>
    <rect x="758" y="160" width="118" height="84" fill="#ffffff" stroke="#8a8f98"/><rect x="758" y="160" width="118" height="8" fill="#1d3aa6"/>
  </g>
  <g font-size="12" fill="#0b0b0b">
    <text x="176" y="188" font-weight="700">Ventoy (E:)</text><text x="176" y="204">57,66 GB exFAT</text><text x="176" y="220">Correcto (partición primaria)</text>
    <text x="766" y="188" font-weight="700">VTOYEFI</text><text x="766" y="204">32 MB FAT</text><text x="766" y="220">Correcto</text>
  </g>

  <!-- notas -->
  <g font-size="13" fill="#0b0b0b">
    <circle cx="34" cy="276" r="8" fill="#2a78d6"/><text x="50" y="281"><tspan font-weight="700">¿GPT o MBR?</tspan> Clic derecho en «Disco 0» → Propiedades → Volúmenes → Estilo de partición.</text>
    <circle cx="34" cy="302" r="8" fill="#1baf7a"/><text x="50" y="307"><tspan font-weight="700">Clic derecho en un volumen:</tspan> reducir, extender, formatear, cambiar la letra…</text>
    <circle cx="34" cy="328" r="8" fill="#d03b3b"/><text x="50" y="333"><tspan font-weight="700">Cuidado:</tspan> son tus discos de verdad. Aquí se mira; los cambios, en una máquina virtual.</text>
  </g>
</svg>
