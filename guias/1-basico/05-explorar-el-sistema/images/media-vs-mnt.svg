<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">/media y /mnt</title>
  <desc id="d">En /media el sistema monta solo los pinchos y discos que conectas, en /media/alumno/NOMBRE. En /mnt montas tú a mano, con sudo mount, cuando lo necesitas.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="249" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Dos puertas para otros discos</text>

  <rect x="24" y="58" width="398" height="170" rx="12" fill="#d6efd6" stroke="#008300" stroke-width="2"/>
  <text x="40" y="88" font-size="20" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">/media</text>
  <text x="140" y="88" font-size="14" font-weight="700" fill="#0b0b0b">automático</text>
  <rect x="40" y="108" width="54" height="28" rx="6" fill="#ffffff" stroke="#008300" stroke-width="2"/>
  <rect x="94" y="114" width="14" height="16" rx="2" fill="#ffffff" stroke="#008300" stroke-width="2"/>
  <path d="M118 122 H 160" stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
  <text x="168" y="127" font-size="13" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">/media/alumno/MI_USB</text>
  <text x="40" y="168" font-size="13" fill="#0b0b0b">Conectas un pincho y el sistema lo monta solo,</text>
  <text x="40" y="188" font-size="13" fill="#0b0b0b">con el nombre de su etiqueta.</text>
  <text x="40" y="212" font-size="13" fill="#52514e">Es lo que pasa cuando aparece el icono en el escritorio.</text>

  <rect x="438" y="58" width="398" height="170" rx="12" fill="#eef0f3" stroke="#8a8f98" stroke-width="2"/>
  <text x="454" y="88" font-size="20" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">/mnt</text>
  <text x="528" y="88" font-size="14" font-weight="700" fill="#0b0b0b">a mano</text>
  <rect x="454" y="106" width="366" height="32" rx="8" fill="#1e2227"/>
  <text x="466" y="127" font-size="13" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#e6e9ee">sudo mount /dev/sr0 /mnt</text>
  <text x="454" y="168" font-size="13" fill="#0b0b0b">Lo usa el administrador para montajes</text>
  <text x="454" y="188" font-size="13" fill="#0b0b0b">puntuales: rescatar un disco, revisar una ISO…</text>
  <text x="454" y="212" font-size="13" fill="#52514e">Normalmente está vacío.</text>
</svg>
