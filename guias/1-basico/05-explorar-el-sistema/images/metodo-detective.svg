<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">El método del detective</title>
  <desc id="d">Seis pasos para investigar un directorio: mira dentro con ls -l, averigua de quién es con ls -ld, mira qué tipo de ficheros hay con file, mide cuánto ocupa con du -sh, lee el manual con man hier y haz el experimento. Con todo eso rellenas la tabla de referencia y escribes el apartado.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">El método del detective: 6 pasos para cada directorio</text>

  <g>
    <rect x="24" y="62" width="132" height="132" rx="12" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
    <rect x="168" y="62" width="132" height="132" rx="12" fill="#fde4d8" stroke="#eb6834" stroke-width="2"/>
    <rect x="312" y="62" width="132" height="132" rx="12" fill="#d3f2e6" stroke="#1baf7a" stroke-width="2"/>
    <rect x="456" y="62" width="132" height="132" rx="12" fill="#fdefcc" stroke="#eda100" stroke-width="2"/>
    <rect x="600" y="62" width="132" height="132" rx="12" fill="#fbe3ec" stroke="#e87ba4" stroke-width="2"/>
    <rect x="744" y="62" width="132" height="132" rx="12" fill="#e4e0f8" stroke="#6250d6" stroke-width="2"/>
  </g>
  <g fill="#ffffff" stroke-width="2">
    <circle cx="48" cy="86" r="14" stroke="#2a78d6"/><circle cx="192" cy="86" r="14" stroke="#eb6834"/>
    <circle cx="336" cy="86" r="14" stroke="#1baf7a"/><circle cx="480" cy="86" r="14" stroke="#eda100"/>
    <circle cx="624" cy="86" r="14" stroke="#e87ba4"/><circle cx="768" cy="86" r="14" stroke="#6250d6"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#0b0b0b">
    <text x="48" y="91">1</text><text x="192" y="91">2</text><text x="336" y="91">3</text>
    <text x="480" y="91">4</text><text x="624" y="91">5</text><text x="768" y="91">6</text>
  </g>
  <g font-size="14" font-weight="700" fill="#0b0b0b">
    <text x="36" y="126">Mira dentro</text>
    <text x="180" y="126">¿De quién es?</text>
    <text x="324" y="126">¿Qué tipo de</text><text x="324" y="144">ficheros hay?</text>
    <text x="468" y="126">¿Cuánto ocupa?</text>
    <text x="612" y="126">¿Qué dice</text><text x="612" y="144">el manual?</text>
    <text x="756" y="126">Haz el</text><text x="756" y="144">experimento</text>
  </g>
  <g font-size="12.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">
    <text x="36" y="178">ls -l /dir</text>
    <text x="180" y="178">ls -ld /dir</text>
    <text x="324" y="178">file /dir/algo</text>
    <text x="468" y="178">sudo du -sh /dir</text>
    <text x="612" y="178">man hier</text>
    <text x="756" y="178">el de tu misión</text>
  </g>
  <g stroke="#52514e" stroke-width="2" fill="none">
    <path d="M156 128 H 166" marker-end="url(#flecha)"/><path d="M300 128 H 310" marker-end="url(#flecha)"/>
    <path d="M444 128 H 454" marker-end="url(#flecha)"/><path d="M588 128 H 598" marker-end="url(#flecha)"/>
    <path d="M732 128 H 742" marker-end="url(#flecha)"/>
  </g>

  <path d="M450 200 V 222" stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
  <rect x="140" y="226" width="620" height="54" rx="12" fill="#1e2227"/>
  <text x="450" y="249" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Con lo que has visto → rellenas tu fila de la tabla de referencia</text>
  <text x="450" y="269" font-size="13" text-anchor="middle" fill="#c9ccd1">→ y escribes el apartado del documento con TUS palabras y TU salida</text>
</svg>
