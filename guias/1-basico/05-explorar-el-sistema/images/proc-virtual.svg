<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">/proc y /sys no están en el disco</title>
  <desc id="d">Un fichero normal como /etc/hostname está guardado en el disco. Los ficheros de /proc y /sys no existen en el disco: cuando los lees, el núcleo se inventa la respuesta en ese momento con datos de la RAM y del hardware. Por eso ls -l dice que ocupan 0 bytes.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="299" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Ficheros de verdad y ficheros «inventados»</text>

  <!-- izquierda: disco -->
  <rect x="24" y="60" width="396" height="216" rx="12" fill="#f7f8fa" stroke="#c9ccd1"/>
  <text x="40" y="86" font-size="12" font-weight="700" letter-spacing="1.5" fill="#52514e">UN FICHERO NORMAL</text>
  <ellipse cx="110" cy="128" rx="56" ry="14" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <path d="M54 128 V 200 a56 14 0 0 0 112 0 V 128" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <ellipse cx="110" cy="128" rx="56" ry="14" fill="#e4effc" stroke="#2a78d6" stroke-width="2"/>
  <text x="110" y="176" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">disco</text>
  <g font-size="13" fill="#0b0b0b">
    <text x="190" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700">/etc/hostname</text>
    <text x="190" y="152" fill="#52514e">está guardado en el disco</text>
    <text x="190" y="172" fill="#52514e">ocupa lo que mide su texto</text>
    <text x="190" y="192" fill="#52514e">sigue igual al reiniciar</text>
  </g>
  <rect x="40" y="226" width="364" height="36" rx="8" fill="#1e2227"/>
  <text x="52" y="249" font-size="12.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#e6e9ee">-rw-r--r-- 1 root root  9 … hostname</text>

  <!-- derecha: núcleo -->
  <rect x="440" y="60" width="396" height="216" rx="12" fill="#f7f8fa" stroke="#c9ccd1"/>
  <text x="456" y="86" font-size="12" font-weight="700" letter-spacing="1.5" fill="#52514e">UN FICHERO DE /proc</text>
  <rect x="474" y="104" width="84" height="84" rx="10" fill="#e4e0f8" stroke="#6250d6" stroke-width="2"/>
  <g stroke="#6250d6" stroke-width="2">
    <line x1="490" y1="104" x2="490" y2="94"/><line x1="516" y1="104" x2="516" y2="94"/><line x1="542" y1="104" x2="542" y2="94"/>
    <line x1="490" y1="188" x2="490" y2="198"/><line x1="516" y1="188" x2="516" y2="198"/><line x1="542" y1="188" x2="542" y2="198"/>
  </g>
  <text x="516" y="151" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">núcleo</text>
  <path d="M564 146 H 600" stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
  <g font-size="13" fill="#0b0b0b">
    <text x="606" y="128" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700">/proc/cpuinfo</text>
    <text x="606" y="152" fill="#52514e">NO está en el disco</text>
    <text x="606" y="172" fill="#52514e">el núcleo lo inventa</text>
    <text x="606" y="192" fill="#52514e">justo cuando lo lees</text>
  </g>
  <rect x="456" y="226" width="364" height="36" rx="8" fill="#1e2227"/>
  <text x="468" y="249" font-size="12.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#e6e9ee">-r--r--r-- 1 root root  <tspan fill="#ffb4a2" font-weight="700">0</tspan> … cpuinfo</text>
</svg>
