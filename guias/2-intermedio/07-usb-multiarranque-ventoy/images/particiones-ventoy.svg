<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Las dos particiones del pincho Ventoy</title>
  <desc id="d">El pincho tiene una tabla de particiones MBR al principio, una partición grande llamada Ventoy en exFAT donde se copian las ISO, y una partición pequeña de 32 MB llamada VTOYEFI en FAT con el cargador de arranque.</desc>
  <rect x="0.5" y="0.5" width="859" height="289" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Cómo queda el pincho por dentro</text>
  <text x="24" y="60" font-size="14" fill="#52514e">Pendrive de 64 GB después de instalar Ventoy (dibujo no a escala: 32 MB es diminuto al lado del resto)</text>

  <!-- barra del pincho -->
  <rect x="40" y="96" width="18" height="76" fill="#8a8f98"/>
  <rect x="60" y="96" width="640" height="76" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <rect x="702" y="96" width="118" height="76" fill="#fbe3ec" stroke="#e87ba4" stroke-width="2"/>
  <rect x="820" y="116" width="18" height="36" rx="3" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>

  <text x="76" y="122" font-size="16" font-weight="700" fill="#0b0b0b">Partición 1 · «Ventoy»</text>
  <text x="76" y="142" font-size="13" fill="#52514e">exFAT · casi todo el pincho</text>
  <g font-size="11.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#0b0b0b">
    <rect x="330" y="110" width="104" height="22" rx="5" fill="#ffffff" stroke="#2a78d6"/><text x="338" y="125">win11.iso</text>
    <rect x="442" y="110" width="104" height="22" rx="5" fill="#ffffff" stroke="#2a78d6"/><text x="450" y="125">mint.iso</text>
    <rect x="554" y="110" width="132" height="22" rx="5" fill="#ffffff" stroke="#2a78d6"/><text x="562" y="125">LEEME.txt</text>
    <rect x="330" y="140" width="104" height="22" rx="5" fill="#ffffff" stroke="#2a78d6"/><text x="338" y="155">hirens.iso</text>
    <rect x="442" y="140" width="104" height="22" rx="5" fill="#ffffff" stroke="#2a78d6"/><text x="450" y="155">drivers/</text>
    <rect x="554" y="140" width="132" height="22" rx="5" fill="#ffffff" stroke="#2a78d6"/><text x="562" y="155">ventoy.json</text>
  </g>
  <text x="761" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">Partición 2</text>
  <text x="761" y="146" font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">«VTOYEFI»</text>
  <text x="761" y="163" font-size="12" text-anchor="middle" fill="#52514e">FAT · 32 MB</text>

  <!-- explicaciones -->
  <g stroke="#8a8f98" stroke-width="1.5">
    <line x1="49" y1="172" x2="49" y2="196"/>
    <line x1="380" y1="172" x2="380" y2="196"/>
    <line x1="761" y1="172" x2="761" y2="196"/>
  </g>
  <g font-size="13" fill="#0b0b0b">
    <text x="40" y="214" font-weight="700">MBR</text>
    <text x="40" y="232" fill="#52514e">la tabla de</text>
    <text x="40" y="250" fill="#52514e">particiones</text>

    <text x="380" y="214" font-weight="700" text-anchor="middle">Un almacén normal</text>
    <text x="380" y="232" text-anchor="middle" fill="#52514e">Windows la ve como una unidad USB más (E:).</text>
    <text x="380" y="250" text-anchor="middle" fill="#52514e">Aquí copias ISO, documentos, drivers, programas…</text>

    <text x="830" y="214" font-weight="700" text-anchor="end">El cargador de Ventoy</text>
    <text x="830" y="232" text-anchor="end" fill="#52514e">Hace de partición EFI.</text>
    <text x="830" y="250" text-anchor="end" fill="#52514e">Windows no le da letra.</text>
  </g>
  <text x="24" y="278" font-size="12" fill="#52514e">Al elegir una ISO, Ventoy no la descomprime ni la copia: la abre tal cual y le hace creer al sistema que está leyendo un DVD.</text>
</svg>
