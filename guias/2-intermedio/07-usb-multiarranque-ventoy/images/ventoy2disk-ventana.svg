<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">La ventana de Ventoy2Disk</title>
  <desc id="d">Esquema de la ventana de Ventoy2Disk con cinco zonas numeradas: 1, el menú Opción con Secure Boot y estilo de partición; 2, la lista de dispositivos, donde se elige el pincho por su capacidad; 3, las versiones de Ventoy en el paquete y en el dispositivo; 4, el botón Instalar, que borra todo; 5, el botón Actualizar, que conserva las ISO.</desc>
  <rect x="0.5" y="0.5" width="859" height="379" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">La ventana de Ventoy2Disk</text>

  <!-- ventana -->
  <rect x="24" y="58" width="440" height="296" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <path d="M24 66 a8 8 0 0 1 8 -8 h424 a8 8 0 0 1 8 8 v22 h-440 z" fill="#eef0f3"/>
  <text x="40" y="79" font-size="13" fill="#0b0b0b">Ventoy2Disk</text>
  <g stroke="#52514e" stroke-width="1.5"><line x1="398" y1="74" x2="408" y2="74"/><rect x="420" y="68" width="10" height="10" fill="none"/><path d="M442 68 l10 10 M452 68 l-10 10"/></g>
  <line x1="24" y1="88" x2="464" y2="88" stroke="#c9ccd1"/>
  <text x="40" y="106" font-size="13" fill="#0b0b0b">Opción</text>
  <text x="100" y="106" font-size="13" fill="#0b0b0b">Idioma</text>
  <line x1="24" y1="114" x2="464" y2="114" stroke="#e2e5e9"/>

  <text x="40" y="136" font-size="13" fill="#52514e">Dispositivo</text>
  <rect x="40" y="144" width="330" height="30" rx="4" fill="#ffffff" stroke="#8a8f98"/>
  <text x="50" y="164" font-size="13" fill="#0b0b0b">E: [57.7 GB] SanDisk Ultra</text>
  <path d="M352 156 l6 6 l6 -6" fill="none" stroke="#52514e" stroke-width="1.5"/>
  <rect x="380" y="144" width="34" height="30" rx="4" fill="#eef0f3" stroke="#8a8f98"/>
  <path d="M403 152 a7 7 0 1 0 2 8" fill="none" stroke="#52514e" stroke-width="1.8"/>
  <path d="M399 150 l5 1 l-1 5" fill="none" stroke="#52514e" stroke-width="1.8"/>

  <rect x="40" y="190" width="190" height="66" rx="6" fill="#f7f8fa" stroke="#c9ccd1"/>
  <text x="135" y="210" font-size="12" text-anchor="middle" fill="#52514e">Ventoy en paquete</text>
  <text x="128" y="242" font-size="22" font-weight="700" text-anchor="middle" fill="#008300">1.1.17</text>
  <path d="M196 226 l-9 3 v8 c0 6 4 10 9 12 c5 -2 9 -6 9 -12 v-8 z" fill="#d6efd6" stroke="#008300" stroke-width="1.5"/>
  <rect x="244" y="190" width="190" height="66" rx="6" fill="#f7f8fa" stroke="#c9ccd1"/>
  <text x="339" y="210" font-size="12" text-anchor="middle" fill="#52514e">Ventoy en dispositivo</text>
  <text x="339" y="242" font-size="22" font-weight="700" text-anchor="middle" fill="#8a8f98">—</text>

  <rect x="40" y="268" width="394" height="24" rx="4" fill="#eef0f3"/>
  <text x="50" y="285" font-size="12" fill="#0b0b0b">Estado: LISTO</text>

  <rect x="110" y="306" width="110" height="34" rx="6" fill="#eef0f3" stroke="#8a8f98"/>
  <text x="165" y="328" font-size="14" text-anchor="middle" fill="#0b0b0b">Instalar</text>
  <rect x="250" y="306" width="110" height="34" rx="6" fill="#eef0f3" stroke="#8a8f98"/>
  <text x="305" y="328" font-size="14" text-anchor="middle" fill="#0b0b0b">Actualizar</text>

  <!-- números sobre la ventana -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="160" cy="101" r="11" fill="#2a78d6"/><text x="160" y="106">1</text>
    <circle cx="440" cy="159" r="11" fill="#eb6834"/><text x="440" y="164">2</text>
    <circle cx="448" cy="223" r="11" fill="#1baf7a"/><text x="448" y="228" fill="#0b0b0b">3</text>
    <circle cx="94" cy="323" r="11" fill="#d03b3b"/><text x="94" y="328">4</text>
    <circle cx="376" cy="323" r="11" fill="#008300"/><text x="376" y="328">5</text>
  </g>

  <!-- explicaciones -->
  <g font-size="13" fill="#0b0b0b">
    <circle cx="498" cy="72" r="11" fill="#2a78d6"/><text x="498" y="77" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="518" y="77" font-weight="700">Opción</text>
    <text x="518" y="96" fill="#52514e">Marca «Soporte Secure Boot» y deja</text>
    <text x="518" y="113" fill="#52514e">el estilo de partición en MBR.</text>

    <circle cx="498" cy="138" r="11" fill="#eb6834"/><text x="498" y="143" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="518" y="143" font-weight="700">Dispositivo</text>
    <text x="518" y="162" fill="#52514e">Elige tu pincho fijándote en la</text>
    <text x="518" y="179" fill="#52514e">CAPACIDAD. Si dudas, para.</text>

    <circle cx="498" cy="204" r="11" fill="#1baf7a"/><text x="498" y="209" font-weight="700" text-anchor="middle">3</text>
    <text x="518" y="209" font-weight="700">Versiones</text>
    <text x="518" y="228" fill="#52514e">La que vas a instalar y la que ya tiene</text>
    <text x="518" y="245" fill="#52514e">el pincho (vacío = sin Ventoy). El</text>
    <text x="518" y="262" fill="#52514e">escudo indica Secure Boot activado.</text>

    <circle cx="498" cy="287" r="11" fill="#d03b3b"/><text x="498" y="292" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
    <text x="518" y="292" font-weight="700">Instalar = formatear: ¡borra todo!</text>

    <circle cx="498" cy="320" r="11" fill="#008300"/><text x="498" y="325" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
    <text x="518" y="325" font-weight="700">Actualizar = sólo cambia VTOYEFI.</text>
    <text x="518" y="342" fill="#52514e">Tus ISO se quedan donde estaban.</text>
  </g>
  <text x="24" y="372" font-size="11.5" fill="#52514e">Esquema simplificado: los textos pueden variar un poco según la versión y el idioma.</text>
</svg>
