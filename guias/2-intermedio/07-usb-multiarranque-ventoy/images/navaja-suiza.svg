<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Las hojas de la navaja suiza</title>
  <desc id="d">Las ISO del pincho en cuatro grupos. Instalar: Windows 11, Ubuntu, Linux Mint y Arch Linux. Rescatar: Hiren's BootCD PE y SystemRescue. Discos: Clonezilla, Rescuezilla, GParted Live, Memtest86+ y ShredOS. Seguridad y red: Kali Linux y netboot.xyz.</desc>
  <rect x="0.5" y="0.5" width="899" height="349" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Las hojas de tu navaja suiza</text>

