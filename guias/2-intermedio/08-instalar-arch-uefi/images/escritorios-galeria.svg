<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="532" viewBox="0 0 900 532" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Galería de escritorios para Arch</title>
  <desc id="d">Esquemas de siete escritorios. XFCE: panel arriba y dock abajo, ligero, el de clase. KDE Plasma: barra abajo como Windows, muy configurable. GNOME: barra fina arriba y todo con el buscador. Cinnamon: el de Linux Mint, barra abajo. MATE: dos paneles, clásico y ligero. LXQt: muy ligero, barra abajo. i3: ventanas en mosaico manejadas con el teclado.</desc>
  <rect x="0.5" y="0.5" width="899" height="531" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Elige tu escritorio: así se ven (en esquema)</text>

  <!-- tarjetas -->
  <g fill="#ffffff" stroke="#c9ccd1">
    <rect x="24" y="56" width="204" height="224" rx="12"/><rect x="240" y="56" width="204" height="224" rx="12"/>
    <rect x="456" y="56" width="204" height="224" rx="12"/><rect x="672" y="56" width="204" height="224" rx="12"/>
    <rect x="24" y="294" width="204" height="224" rx="12"/><rect x="240" y="294" width="204" height="224" rx="12"/>
    <rect x="456" y="294" width="204" height="224" rx="12"/>
  </g>
  <rect x="672" y="294" width="204" height="224" rx="12" fill="#1e2227"/>

  <!-- XFCE -->
  <rect x="36" y="68" width="180" height="110" rx="4" fill="#5b7fa6"/>
  <rect x="36" y="68" width="180" height="9" fill="#2b2d31"/>
  <rect x="96" y="164" width="60" height="12" rx="3" fill="#2b2d31"/>
  <rect x="70" y="92" width="100" height="58" rx="3" fill="#ffffff"/><rect x="70" y="92" width="100" height="9" rx="3" fill="#c9ccd1"/>
  <!-- KDE -->
  <rect x="252" y="68" width="180" height="110" rx="4" fill="#3d6fb5"/>
  <rect x="252" y="164" width="180" height="14" fill="#20252b"/>
  <rect x="256" y="167" width="9" height="8" rx="2" fill="#86b6ef"/>
  <rect x="270" y="167" width="22" height="8" rx="2" fill="#4a5059"/><rect x="296" y="167" width="22" height="8" rx="2" fill="#4a5059"/>
  <rect x="286" y="88" width="110" height="62" rx="3" fill="#ffffff"/><rect x="286" y="88" width="110" height="9" rx="3" fill="#c9ccd1"/>
  <!-- GNOME -->
  <rect x="468" y="68" width="180" height="110" rx="4" fill="#4a4a6a"/>
  <rect x="468" y="68" width="180" height="9" fill="#000000"/>
  <rect x="472" y="70" width="22" height="5" rx="2.5" fill="#ffffff"/><circle cx="558" cy="72.5" r="2.5" fill="#ffffff"/>
  <rect x="503" y="90" width="110" height="68" rx="8" fill="#ffffff"/><rect x="503" y="90" width="110" height="12" rx="8" fill="#e4e0f8"/>
  <!-- Cinnamon -->
  <rect x="684" y="68" width="180" height="110" rx="4" fill="#4f7a5a"/>
  <rect x="684" y="164" width="180" height="14" fill="#2b2d31"/>
  <rect x="688" y="167" width="9" height="8" rx="2" fill="#86d39a"/>
  <rect x="702" y="167" width="22" height="8" rx="2" fill="#4a5059"/><rect x="852" y="168" width="8" height="6" rx="1" fill="#c9ccd1"/>
  <rect x="716" y="88" width="110" height="62" rx="3" fill="#ffffff"/><rect x="716" y="88" width="110" height="9" rx="3" fill="#c9ccd1"/>
  <!-- MATE -->
  <rect x="36" y="306" width="180" height="110" rx="4" fill="#6a8a4a"/>
  <rect x="36" y="306" width="180" height="9" fill="#3c3f44"/><rect x="36" y="407" width="180" height="9" fill="#3c3f44"/>
  <rect x="70" y="330" width="100" height="58" rx="3" fill="#ffffff"/><rect x="70" y="330" width="100" height="9" rx="3" fill="#c9ccd1"/>
  <!-- LXQt -->
  <rect x="252" y="306" width="180" height="110" rx="4" fill="#2f5f8f"/>
  <rect x="252" y="404" width="180" height="12" fill="#1e2227"/>
  <rect x="256" y="406" width="8" height="8" rx="2" fill="#86b6ef"/>
  <rect x="290" y="328" width="100" height="58" rx="3" fill="#ffffff"/><rect x="290" y="328" width="100" height="9" rx="3" fill="#c9ccd1"/>
  <!-- i3 -->
  <rect x="468" y="306" width="180" height="110" rx="4" fill="#111111"/>
  <rect x="468" y="406" width="180" height="10" fill="#222222"/>
  <rect x="471" y="309" width="86" height="94" fill="#1e2227" stroke="#2a78d6" stroke-width="2"/>
  <rect x="561" y="309" width="84" height="45" fill="#2b2d31" stroke="#4a5059"/>
  <rect x="561" y="357" width="84" height="46" fill="#2b2d31" stroke="#4a5059"/>
  <g fill="#7fe0b6"><rect x="477" y="318" width="40" height="4"/><rect x="477" y="328" width="60" height="4"/><rect x="477" y="338" width="30" height="4"/></g>

  <!-- nombres -->
  <g font-size="16" font-weight="700" fill="#0b0b0b">
    <text x="36" y="200">XFCE</text><text x="252" y="200">KDE Plasma</text><text x="468" y="200">GNOME</text><text x="684" y="200">Cinnamon</text>
    <text x="36" y="438">MATE</text><text x="252" y="438">LXQt</text><text x="468" y="438">i3</text>
  </g>
  <g font-size="12.5" fill="#52514e">
    <text x="36" y="220">Ligero y clásico.</text><text x="36" y="236">El que usamos en clase.</text>
    <text x="252" y="220">Barra abajo, como Windows.</text><text x="252" y="236">Muy configurable.</text>
    <text x="468" y="220">Moderno, sin barra abajo.</text><text x="468" y="236">Todo se busca escribiendo.</text>
    <text x="684" y="220">El de Linux Mint.</text><text x="684" y="236">Familiar y cómodo.</text>
    <text x="36" y="458">Clásico, con dos paneles.</text><text x="36" y="474">Ligero y estable.</text>
    <text x="252" y="458">Muy ligero.</text><text x="252" y="474">Para equipos con poca RAM.</text>
    <text x="468" y="458">Ventanas en mosaico.</text><text x="468" y="474">Todo con el teclado.</text>
  </g>
  <g font-size="11.5" font-weight="700" text-anchor="middle">
    <rect x="36" y="248" width="132" height="20" rx="10" fill="#d6efd6" stroke="#008300"/><text x="102" y="262" fill="#0b0b0b">MV 2 GB · recomendado</text>
    <rect x="252" y="248" width="70" height="20" rx="10" fill="#fdefcc" stroke="#eda100"/><text x="287" y="262" fill="#0b0b0b">MV 4 GB</text>
    <rect x="468" y="248" width="70" height="20" rx="10" fill="#fdefcc" stroke="#eda100"/><text x="503" y="262" fill="#0b0b0b">MV 4 GB</text>
    <rect x="684" y="248" width="70" height="20" rx="10" fill="#fdefcc" stroke="#eda100"/><text x="719" y="262" fill="#0b0b0b">MV 3 GB</text>
    <rect x="36" y="486" width="70" height="20" rx="10" fill="#d6efd6" stroke="#008300"/><text x="71" y="500" fill="#0b0b0b">MV 2 GB</text>
    <rect x="252" y="486" width="70" height="20" rx="10" fill="#d6efd6" stroke="#008300"/><text x="287" y="500" fill="#0b0b0b">MV 2 GB</text>
    <rect x="468" y="486" width="132" height="20" rx="10" fill="#e4e0f8" stroke="#6250d6"/><text x="534" y="500" fill="#0b0b0b">MV 2 GB · ampliación</text>
  </g>

  <!-- ¿cuál elijo? -->
  <text x="688" y="324" font-size="16" font-weight="700" fill="#ffffff">¿Cuál elijo?</text>
  <g font-size="12.5" fill="#e6e9ee">
    <text x="688" y="352">Primera vez o MV de 2 GB:</text>
    <text x="688" y="370" font-weight="700" fill="#7fe0b6">XFCE</text>
    <text x="688" y="398">Quiero que parezca Windows:</text>
    <text x="688" y="416" font-weight="700" fill="#86b6ef">KDE Plasma o Cinnamon</text>
    <text x="688" y="444">Quiero algo distinto:</text>
    <text x="688" y="462" font-weight="700" fill="#ffb27a">GNOME</text>
    <text x="688" y="490">Me gusta el teclado y el reto:</text>
    <text x="688" y="508" font-weight="700" fill="#c9b8ff">i3</text>
  </g>
</svg>
