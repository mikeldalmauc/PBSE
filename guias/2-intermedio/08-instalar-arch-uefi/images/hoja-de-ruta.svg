<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="912" height="318" viewBox="0 0 912 318" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Hoja de ruta de la instalación de Arch</title>
  <desc id="d">Tres partes. Parte 1, pasos 1 a 6: crear la MV, arrancar la ISO, comprobar, particionar en GPT, formatear y montar; termina con la instantánea 01-particionado. Parte 2, pasos 7 a 14: pacstrap, fstab, chroot, hora e idioma, nombre, usuarios, GRUB y red; termina con la instantánea 02-sistema-base. Parte 3, pasos 15 a 18: Guest Additions, escritorio, AUR e incidencias; termina con la instantánea 03-escritorio.</desc>
  <rect x="0.5" y="0.5" width="911" height="317" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">La hoja de ruta: 18 pasos en 3 partes</text>

  <!-- etiquetas de parte -->
  <g font-size="15" font-weight="700" fill="#0b0b0b">
    <text x="24" y="86">Parte 1</text><text x="24" y="168">Parte 2</text><text x="24" y="250">Parte 3</text>
  </g>
  <g font-size="11.5" fill="#52514e">
    <text x="24" y="104">preparar y</text><text x="24" y="118">particionar</text>
    <text x="24" y="186">sistema base</text><text x="24" y="200">y arranque</text>
    <text x="24" y="268">escritorio e</text><text x="24" y="282">incidencias</text>
  </g>

  <!-- fila 1 -->
  <g stroke="#2a78d6" stroke-width="2" fill="#cde2fb">
    <rect x="128" y="64" width="78" height="56" rx="10"/><rect x="210" y="64" width="78" height="56" rx="10"/>
    <rect x="292" y="64" width="78" height="56" rx="10"/><rect x="374" y="64" width="78" height="56" rx="10"/>
    <rect x="456" y="64" width="78" height="56" rx="10"/><rect x="538" y="64" width="78" height="56" rx="10"/>
  </g>
  <!-- fila 2 -->
  <g stroke="#eb6834" stroke-width="2" fill="#fde4d8">
    <rect x="128" y="146" width="78" height="56" rx="10"/><rect x="210" y="146" width="78" height="56" rx="10"/>
    <rect x="292" y="146" width="78" height="56" rx="10"/><rect x="374" y="146" width="78" height="56" rx="10"/>
    <rect x="456" y="146" width="78" height="56" rx="10"/><rect x="538" y="146" width="78" height="56" rx="10"/>
    <rect x="620" y="146" width="78" height="56" rx="10"/><rect x="702" y="146" width="78" height="56" rx="10"/>
  </g>
  <!-- fila 3 -->
  <g stroke="#1baf7a" stroke-width="2" fill="#d3f2e6">
    <rect x="128" y="228" width="78" height="56" rx="10"/><rect x="210" y="228" width="78" height="56" rx="10"/>
    <rect x="292" y="228" width="78" height="56" rx="10"/><rect x="374" y="228" width="78" height="56" rx="10"/>
  </g>

  <g font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">
    <text x="167" y="86">1</text><text x="249" y="86">2</text><text x="331" y="86">3</text><text x="413" y="86">4</text><text x="495" y="86">5</text><text x="577" y="86">6</text>
    <text x="167" y="168">7</text><text x="249" y="168">8</text><text x="331" y="168">9</text><text x="413" y="168">10</text><text x="495" y="168">11</text><text x="577" y="168">12</text><text x="659" y="168">13</text><text x="741" y="168">14</text>
    <text x="167" y="250">15</text><text x="249" y="250">16</text><text x="331" y="250">17</text><text x="413" y="250">18</text>
  </g>
  <g font-size="12" fill="#0b0b0b" text-anchor="middle">
    <text x="167" y="108">Crear MV</text><text x="249" y="108">Arrancar ISO</text><text x="331" y="108">Comprobar</text>
    <text x="413" y="108" font-weight="700">Particionar</text><text x="495" y="108">Formatear</text><text x="577" y="108">Montar</text>
    <text x="167" y="190">pacstrap</text><text x="249" y="190">fstab</text><text x="331" y="190">chroot</text><text x="413" y="190">Hora/idioma</text>
    <text x="495" y="190">Nombre</text><text x="577" y="190">Usuarios</text><text x="659" y="190">GRUB</text><text x="741" y="190">Red</text>
    <text x="167" y="272">Guest Add.</text><text x="249" y="272">Escritorio</text><text x="331" y="272">AUR</text><text x="413" y="272">Incidencias</text>
  </g>
  <text x="413" y="133" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2a78d6">GPT</text>

  <!-- instantáneas -->
  <g>
    <rect x="626" y="64" width="110" height="56" rx="10" fill="#ffffff" stroke="#52514e" stroke-dasharray="5 4"/>
    <rect x="784" y="146" width="104" height="56" rx="10" fill="#ffffff" stroke="#52514e" stroke-dasharray="5 4"/>
    <rect x="460" y="228" width="110" height="56" rx="10" fill="#ffffff" stroke="#52514e" stroke-dasharray="5 4"/>
  </g>
  <g fill="#52514e">
    <rect x="636" y="74" width="20" height="14" rx="3"/><circle cx="646" cy="81" r="4" fill="#ffffff"/>
    <rect x="794" y="156" width="20" height="14" rx="3"/><circle cx="804" cy="163" r="4" fill="#ffffff"/>
    <rect x="470" y="238" width="20" height="14" rx="3"/><circle cx="480" cy="245" r="4" fill="#ffffff"/>
  </g>
  <g font-size="11.5" fill="#0b0b0b">
    <text x="662" y="86" font-weight="700">instantánea</text><text x="636" y="108" font-family="Consolas, 'DejaVu Sans Mono', monospace">01-particionado</text>
    <text x="818" y="168" font-weight="700" font-size="11">instantánea</text><text x="791" y="190" font-size="10.5" font-family="Consolas, 'DejaVu Sans Mono', monospace">02-sistema-base</text>
    <text x="496" y="250" font-weight="700">instantánea</text><text x="470" y="272" font-family="Consolas, 'DejaVu Sans Mono', monospace">03-escritorio</text>
  </g>
  <text x="24" y="308" font-size="12.5" fill="#52514e">Cada parte termina con una instantánea: si algo se tuerce, vuelves ahí en lugar de empezar de cero.</text>
</svg>
