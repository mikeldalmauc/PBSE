<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cómo leer una línea de ls -l</title>
  <desc id="d">La línea -rwxr-xr-- 1 alumno profesores 4096 9 sep 10:24 informe.txt. El primer carácter es el tipo. Después van tres grupos de tres letras: permisos del propietario, del grupo y de otros. Luego el número de enlaces, el usuario propietario, el grupo propietario, el tamaño, la fecha y el nombre.</desc>
  <rect x="0.5" y="0.5" width="899" height="319" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="36" font-size="21" font-weight="700" fill="#0b0b0b">Cómo leer una línea de «ls -l»</text>

  <rect x="24" y="52" width="852" height="44" rx="8" fill="#1e2227"/>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#e6e9ee">
    <text x="40" y="80">-rwxr-xr--</text><text x="160" y="80">1</text><text x="190" y="80">alumno</text>
    <text x="270" y="80">profesores</text><text x="385" y="80">4096</text><text x="440" y="80">9 sep 10:24</text>
    <text x="560" y="80">informe.txt</text>
  </g>
  <path d="M40 102 v6 h94 v-6" fill="none" stroke="#8a8f98" stroke-width="1.5"/>
  <path d="M87 108 V 124" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- letras ampliadas -->
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" text-anchor="middle" fill="#0b0b0b">
    <rect x="40" y="128" width="40" height="44" rx="6" fill="#eef0f3" stroke="#8a8f98" stroke-width="2"/><text x="60" y="158">-</text>
    <rect x="92" y="128" width="120" height="44" rx="6" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="112" y="158">r</text><text x="152" y="158">w</text><text x="192" y="158">x</text>
    <rect x="224" y="128" width="120" height="44" rx="6" fill="#fde4d8" stroke="#eb6834" stroke-width="2"/>
    <text x="244" y="158">r</text><text x="284" y="158">-</text><text x="324" y="158">x</text>
    <rect x="356" y="128" width="120" height="44" rx="6" fill="#d3f2e6" stroke="#1baf7a" stroke-width="2"/>
    <text x="376" y="158">r</text><text x="416" y="158">-</text><text x="456" y="158">-</text>
  </g>
  <g stroke-width="1" stroke-dasharray="2 3">
    <line x1="132" y1="130" x2="132" y2="170" stroke="#2a78d6"/><line x1="172" y1="130" x2="172" y2="170" stroke="#2a78d6"/>
    <line x1="264" y1="130" x2="264" y2="170" stroke="#eb6834"/><line x1="304" y1="130" x2="304" y2="170" stroke="#eb6834"/>
    <line x1="396" y1="130" x2="396" y2="170" stroke="#1baf7a"/><line x1="436" y1="130" x2="436" y2="170" stroke="#1baf7a"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">
    <text x="60" y="196">tipo</text>
    <text x="152" y="196">propietario · u</text>
    <text x="284" y="196">grupo · g</text>
    <text x="416" y="196">otros · o</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#52514e">
    <text x="60" y="216">- fichero</text><text x="60" y="234">d carpeta</text><text x="60" y="252">l enlace</text>
    <text x="152" y="216">lo que puede</text><text x="152" y="234">alumno</text>
    <text x="284" y="216">lo que pueden los</text><text x="284" y="234">de profesores</text>
    <text x="416" y="216">lo que puede</text><text x="416" y="234">todo el resto</text>
  </g>

  <!-- leyenda del resto de columnas -->
  <g font-size="14" fill="#0b0b0b">
    <circle cx="530" cy="136" r="6" fill="#2a78d6"/>
    <text x="544" y="141"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700">alumno</tspan>  usuario propietario</text>
    <circle cx="530" cy="164" r="6" fill="#eb6834"/>
    <text x="544" y="169"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700">profesores</tspan>  grupo propietario</text>
    <text x="544" y="197"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700">1</tspan>  número de enlaces</text>
    <text x="544" y="225"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700">4096</tspan>  tamaño en bytes</text>
    <text x="544" y="253"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700">9 sep 10:24</tspan>  última modificación</text>
  </g>

  <text x="24" y="296" font-size="13" fill="#52514e"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">r</tspan> leer · <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">w</tspan> escribir · <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">x</tspan> ejecutar (o entrar, si es carpeta) · <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">-</tspan> no tiene ese permiso. Siempre en el mismo orden: r w x.</text>
</svg>
