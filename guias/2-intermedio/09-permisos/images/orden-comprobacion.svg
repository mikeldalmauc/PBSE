<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Qué permisos se aplican</title>
  <desc id="d">Linux comprueba en orden: si eres el propietario se aplican los permisos de propietario y no se mira nada más; si no, si estás en el grupo del fichero, los de grupo; si no, los de otros. Sólo se aplica una categoría.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="349" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Sólo se aplica UNA categoría: la primera que encaja</text>

  <rect x="24" y="116" width="150" height="58" rx="12" fill="#eef0f3" stroke="#8a8f98" stroke-width="2"/>
  <text x="99" y="140" font-size="13" text-anchor="middle" fill="#0b0b0b">Alguien intenta</text>
  <text x="99" y="158" font-size="13" text-anchor="middle" fill="#0b0b0b">usar el fichero</text>

  <polygon points="300,95 390,145 300,195 210,145" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
  <text x="300" y="141" font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">¿Es el</text>
  <text x="300" y="159" font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">propietario?</text>

  <polygon points="540,95 630,145 540,195 450,145" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
  <text x="540" y="141" font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">¿Está en el</text>
  <text x="540" y="159" font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">grupo?</text>

  <g stroke="#52514e" stroke-width="2" fill="none">
    <path d="M176 145 H 206" marker-end="url(#flecha)"/>
    <path d="M392 145 H 446" marker-end="url(#flecha)"/>
    <path d="M632 145 H 666" marker-end="url(#flecha)"/>
    <path d="M300 197 V 234" marker-end="url(#flecha)"/>
    <path d="M540 197 V 234" marker-end="url(#flecha)"/>
  </g>
  <g font-size="13" font-weight="700" fill="#52514e">
    <text x="419" y="136" text-anchor="middle">no</text>
    <text x="649" y="136" text-anchor="middle">no</text>
    <text x="310" y="222">sí</text>
    <text x="550" y="222">sí</text>
  </g>

  <rect x="210" y="238" width="180" height="62" rx="12" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="300" y="262" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">Permisos de u</text>
  <text x="300" y="282" font-size="12" text-anchor="middle" fill="#52514e">y no se mira nada más</text>

  <rect x="450" y="238" width="180" height="62" rx="12" fill="#fde4d8" stroke="#eb6834" stroke-width="2"/>
  <text x="540" y="262" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">Permisos de g</text>
  <text x="540" y="282" font-size="12" text-anchor="middle" fill="#52514e">y no se mira nada más</text>

  <rect x="670" y="114" width="166" height="62" rx="12" fill="#d3f2e6" stroke="#1baf7a" stroke-width="2"/>
  <text x="753" y="140" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">Permisos de o</text>
  <text x="753" y="160" font-size="12" text-anchor="middle" fill="#52514e">todos los demás</text>

  <text x="24" y="332" font-size="13" fill="#52514e">Ejemplo: fichero <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">r--rwxrwx</tspan> del que tú eres el propietario → sólo tienes <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="#0b0b0b">r</tspan>. No puedes escribir, aunque tu grupo sí pueda.</text>
</svg>
