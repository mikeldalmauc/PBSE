<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Para qué sirve el SGID en una carpeta compartida</title>
  <desc id="d">Sin SGID, el fichero que crea ana en /datos/ventas lleva su grupo personal, ana, y luis, de ventas, no puede modificarlo. Con SGID en la carpeta, el fichero nace con el grupo ventas y luis puede modificarlo.</desc>
  <rect x="0.5" y="0.5" width="859" height="339" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Por qué una carpeta compartida necesita SGID</text>

  <rect x="24" y="58" width="398" height="242" rx="12" fill="#f7f8fa" stroke="#c9ccd1"/>
  <rect x="438" y="58" width="398" height="242" rx="12" fill="#f7f8fa" stroke="#c9ccd1"/>
  <text x="40" y="86" font-size="16" font-weight="700" fill="#0b0b0b">Sin SGID</text>
  <text x="454" y="86" font-size="16" font-weight="700" fill="#0b0b0b">Con SGID</text>

  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <rect x="40" y="98" width="366" height="30" rx="6" fill="#1e2227"/>
    <text x="52" y="118" fill="#e6e9ee">drwxrwx---  root  ventas  /datos/ventas</text>
    <rect x="454" y="98" width="366" height="30" rx="6" fill="#1e2227"/>
    <text x="466" y="118" fill="#e6e9ee">drwxrw<tspan fill="#ffb27a" font-weight="700">s</tspan>---  root  ventas  /datos/ventas</text>
  </g>

  <g font-size="13" fill="#0b0b0b">
    <text x="40" y="154">ana (de ventas) crea un fichero dentro:</text>
    <text x="454" y="154">ana (de ventas) crea un fichero dentro:</text>
  </g>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <rect x="40" y="164" width="366" height="30" rx="6" fill="#1e2227"/>
    <text x="52" y="184" fill="#e6e9ee">-rw-rw-r--  ana</text>
    <rect x="186" y="169" width="34" height="20" rx="4" fill="#d03b3b"/>
    <text x="190" y="184" fill="#ffffff" font-weight="700">ana</text>
    <text x="232" y="184" fill="#e6e9ee">informe.odt</text>

    <rect x="454" y="164" width="366" height="30" rx="6" fill="#1e2227"/>
    <text x="466" y="184" fill="#e6e9ee">-rw-rw-r--  ana</text>
    <rect x="600" y="169" width="56" height="20" rx="4" fill="#0ca30c"/>
    <text x="604" y="184" fill="#0b0b0b" font-weight="700">ventas</text>
    <text x="666" y="184" fill="#e6e9ee">informe.odt</text>
  </g>
  <g font-size="12" fill="#52514e">
    <text x="40" y="212">el grupo es el personal de ana</text>
    <text x="454" y="212">el grupo es el de la carpeta</text>
  </g>

  <g font-size="13" fill="#0b0b0b">
    <text x="40" y="240">luis (de ventas) intenta modificarlo:</text>
    <text x="454" y="240">luis (de ventas) intenta modificarlo:</text>
  </g>
  <rect x="40" y="250" width="366" height="34" rx="8" fill="#fbdcdc" stroke="#d03b3b" stroke-width="2"/>
  <text x="56" y="272" font-size="14" font-weight="700" fill="#0b0b0b">✕ Permiso denegado (sólo puede leer)</text>
  <rect x="454" y="250" width="366" height="34" rx="8" fill="#d6efd6" stroke="#0ca30c" stroke-width="2"/>
  <text x="470" y="272" font-size="14" font-weight="700" fill="#0b0b0b">✓ Lo modifica sin problema</text>

  <text x="24" y="326" font-size="13" fill="#52514e">SGID en la carpeta = todo lo nuevo nace con el grupo de la carpeta. Es la pieza clave de una carpeta departamental.</text>
</svg>
