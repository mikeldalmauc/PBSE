<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Quién puede hacer qué en /datos</title>
  <desc id="d">Requisitos de la práctica. /datos/direccion: sólo trabaja el grupo direccion. /datos/ventas: trabaja ventas, leen direccion y el usuario auditor; lleva SGID y ACL. /datos/tecnicos: trabaja tecnicos y lee direccion; lleva SGID. /datos/comun: todos escriben pero cada uno sólo borra lo suyo; lleva sticky bit.</desc>
  <rect x="0.5" y="0.5" width="899" height="399" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">La práctica: quién puede hacer qué en /datos</text>

  <!-- cabeceras -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">
    <text x="300" y="72">grupo</text><text x="300" y="90">direccion</text>
    <text x="428" y="72">grupo</text><text x="428" y="90">ventas</text>
    <text x="556" y="72">grupo</text><text x="556" y="90">tecnicos</text>
    <text x="684" y="72">usuario</text><text x="684" y="90">auditor</text>
    <text x="812" y="72">el</text><text x="812" y="90">resto</text>
  </g>
  <line x1="24" y1="100" x2="876" y2="100" stroke="#c9ccd1"/>
  <g stroke="#e2e5e9"><line x1="24" y1="158" x2="876" y2="158"/><line x1="24" y1="216" x2="876" y2="216"/><line x1="24" y1="274" x2="876" y2="274"/></g>

  <!-- etiquetas de fila -->
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#0b0b0b">
    <text x="32" y="126">/datos/direccion</text>
    <text x="32" y="184">/datos/ventas</text>
    <text x="32" y="242">/datos/tecnicos</text>
    <text x="32" y="300">/datos/comun</text>
  </g>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="32" y="134" width="104" height="18" rx="9" fill="#eef0f3" stroke="#8a8f98"/><text x="84" y="147" fill="#0b0b0b">nadie más entra</text>
    <rect x="32" y="192" width="48" height="18" rx="9" fill="#fde4d8" stroke="#eb6834"/><text x="56" y="205" fill="#0b0b0b">SGID</text>
    <rect x="86" y="192" width="44" height="18" rx="9" fill="#e4e0f8" stroke="#6250d6"/><text x="108" y="205" fill="#0b0b0b">ACL</text>
    <rect x="32" y="250" width="48" height="18" rx="9" fill="#fde4d8" stroke="#eb6834"/><text x="56" y="263" fill="#0b0b0b">SGID</text>
    <rect x="32" y="308" width="58" height="18" rx="9" fill="#d3f2e6" stroke="#1baf7a"/><text x="61" y="321" fill="#0b0b0b">sticky</text>
  </g>

  <!-- píldoras: trabaja (verde), lee (azul), escribe (amarillo), nada (gris) -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">
    <!-- fila 1 -->
    <rect x="250" y="116" width="100" height="26" rx="13" fill="#d6efd6" stroke="#008300"/><text x="300" y="134">trabaja</text>
    <rect x="378" y="116" width="100" height="26" rx="13" fill="#eef0f3" stroke="#c9ccd1"/><text x="428" y="134" fill="#8a8f98">—</text>
    <rect x="506" y="116" width="100" height="26" rx="13" fill="#eef0f3" stroke="#c9ccd1"/><text x="556" y="134" fill="#8a8f98">—</text>
    <rect x="634" y="116" width="100" height="26" rx="13" fill="#eef0f3" stroke="#c9ccd1"/><text x="684" y="134" fill="#8a8f98">—</text>
    <rect x="762" y="116" width="100" height="26" rx="13" fill="#eef0f3" stroke="#c9ccd1"/><text x="812" y="134" fill="#8a8f98">—</text>
    <!-- fila 2 -->
    <rect x="250" y="174" width="100" height="26" rx="13" fill="#cde2fb" stroke="#2a78d6"/><text x="300" y="192">lee</text>
    <rect x="378" y="174" width="100" height="26" rx="13" fill="#d6efd6" stroke="#008300"/><text x="428" y="192">trabaja</text>
    <rect x="506" y="174" width="100" height="26" rx="13" fill="#eef0f3" stroke="#c9ccd1"/><text x="556" y="192" fill="#8a8f98">—</text>
    <rect x="634" y="174" width="100" height="26" rx="13" fill="#cde2fb" stroke="#2a78d6"/><text x="684" y="192">lee</text>
    <rect x="762" y="174" width="100" height="26" rx="13" fill="#eef0f3" stroke="#c9ccd1"/><text x="812" y="192" fill="#8a8f98">—</text>
    <!-- fila 3 -->
    <rect x="250" y="232" width="100" height="26" rx="13" fill="#cde2fb" stroke="#2a78d6"/><text x="300" y="250">lee</text>
    <rect x="378" y="232" width="100" height="26" rx="13" fill="#eef0f3" stroke="#c9ccd1"/><text x="428" y="250" fill="#8a8f98">—</text>
    <rect x="506" y="232" width="100" height="26" rx="13" fill="#d6efd6" stroke="#008300"/><text x="556" y="250">trabaja</text>
    <rect x="634" y="232" width="100" height="26" rx="13" fill="#eef0f3" stroke="#c9ccd1"/><text x="684" y="250" fill="#8a8f98">—</text>
    <rect x="762" y="232" width="100" height="26" rx="13" fill="#eef0f3" stroke="#c9ccd1"/><text x="812" y="250" fill="#8a8f98">—</text>
    <!-- fila 4 -->
    <rect x="250" y="290" width="100" height="26" rx="13" fill="#fdefcc" stroke="#eda100"/><text x="300" y="308">escribe</text>
    <rect x="378" y="290" width="100" height="26" rx="13" fill="#fdefcc" stroke="#eda100"/><text x="428" y="308">escribe</text>
    <rect x="506" y="290" width="100" height="26" rx="13" fill="#fdefcc" stroke="#eda100"/><text x="556" y="308">escribe</text>
    <rect x="634" y="290" width="100" height="26" rx="13" fill="#fdefcc" stroke="#eda100"/><text x="684" y="308">escribe</text>
    <rect x="762" y="290" width="100" height="26" rx="13" fill="#fdefcc" stroke="#eda100"/><text x="812" y="308">escribe</text>
  </g>

  <!-- leyenda -->
  <g font-size="12.5" fill="#52514e">
    <rect x="24" y="350" width="60" height="20" rx="10" fill="#d6efd6" stroke="#008300"/><text x="54" y="365" font-weight="700" text-anchor="middle" fill="#0b0b0b">trabaja</text>
    <text x="92" y="365">lee, crea y modifica</text>
    <rect x="232" y="350" width="40" height="20" rx="10" fill="#cde2fb" stroke="#2a78d6"/><text x="252" y="365" font-weight="700" text-anchor="middle" fill="#0b0b0b">lee</text>
    <text x="280" y="365">entra y lee, no modifica</text>
    <rect x="440" y="350" width="60" height="20" rx="10" fill="#fdefcc" stroke="#eda100"/><text x="470" y="365" font-weight="700" text-anchor="middle" fill="#0b0b0b">escribe</text>
    <text x="508" y="365">crea, pero sólo borra lo suyo</text>
    <rect x="696" y="350" width="40" height="20" rx="10" fill="#eef0f3" stroke="#c9ccd1"/><text x="716" y="365" font-weight="700" text-anchor="middle" fill="#8a8f98">—</text>
    <text x="744" y="365">ni siquiera entra</text>
  </g>
  <text x="24" y="390" font-size="12" fill="#52514e">Esto es lo que se pide, no la solución: los permisos en octal, los bits y los comandos los decides tú.</text>
</svg>
