<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Una tubería de Unix</title>
  <desc id="d">fortune genera una frase; por la tubería llega a cowsay, que la transforma en un dibujo; por otra tubería llega a lolcat, que la colorea y la muestra en pantalla. Tres programas que no saben nada el uno del otro, unidos por la salida estándar.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
    <linearGradient id="arcoiris" x1="0" x2="1">
      <stop offset="0" stop-color="#e34948"/><stop offset="0.25" stop-color="#eda100"/><stop offset="0.5" stop-color="#1baf7a"/>
      <stop offset="0.75" stop-color="#2a78d6"/><stop offset="1" stop-color="#6250d6"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="269" rx="14" fill="#fcfcfb" stroke="#e2e5e9"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Una tubería: tres programas en cadena</text>

  <!-- tubos -->
  <rect x="190" y="112" width="90" height="22" fill="#c9ccd1"/>
  <rect x="440" y="112" width="90" height="22" fill="#c9ccd1"/>
  <rect x="690" y="112" width="40" height="22" fill="#c9ccd1"/>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" text-anchor="middle" fill="#0b0b0b">
    <text x="235" y="104">|</text><text x="485" y="104">|</text>
  </g>

  <!-- máquinas -->
  <rect x="40" y="70" width="150" height="106" rx="12" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <rect x="280" y="70" width="160" height="106" rx="12" fill="#fde4d8" stroke="#eb6834" stroke-width="2"/>
  <rect x="530" y="70" width="160" height="106" rx="12" fill="#d3f2e6" stroke="#1baf7a" stroke-width="2"/>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" text-anchor="middle" fill="#0b0b0b">
    <text x="115" y="104">fortune</text><text x="360" y="104">cowsay</text><text x="610" y="104">lolcat</text>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">
    <text x="115" y="132">GENERA</text><text x="360" y="132">TRANSFORMA</text><text x="610" y="132">COLOREA</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#52514e">
    <text x="115" y="154">una frase al azar</text><text x="360" y="154">la mete en un dibujo</text><text x="610" y="154">en arcoíris</text>
  </g>

  <!-- pantalla -->
  <rect x="736" y="70" width="104" height="80" rx="6" fill="#1e2227"/>
  <rect x="772" y="150" width="32" height="10" fill="#8a8f98"/><rect x="756" y="160" width="64" height="6" rx="3" fill="#8a8f98"/>
  <rect x="748" y="86" width="80" height="6" rx="3" fill="url(#arcoiris)"/>
  <rect x="748" y="100" width="64" height="6" rx="3" fill="url(#arcoiris)"/>
  <rect x="748" y="114" width="72" height="6" rx="3" fill="url(#arcoiris)"/>
  <rect x="748" y="128" width="50" height="6" rx="3" fill="url(#arcoiris)"/>

  <rect x="230" y="200" width="400" height="44" rx="10" fill="#1e2227"/>
  <text x="430" y="228" font-size="18" font-weight="700" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#ffffff">fortune | cowsay | lolcat</text>
  <text x="24" y="262" font-size="12.5" fill="#52514e">Cada «|» pasa la salida de un programa a la entrada del siguiente. Ninguno sabe que los otros existen: eso es Unix.</text>
</svg>
